<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Càmera RA amb Línies</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }
        #camera-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #ar-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        canvas { width: 100%; height: 100%; }
        .poi {
            position: absolute; padding: 5px 10px; border-radius: 10px; color: white;
            font-size: 12px; transform: translate(-50%, -100%); white-space: nowrap;
            border: 1px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #controls {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; text-align: center; width: 80%;
        }
        button { padding: 15px 30px; font-size: 18px; border-radius: 30px; border: none; background: #007bff; color: white; cursor: pointer; }
        #debug {
            position: fixed; bottom: 10px; left: 10px; right: 10px;
            background: rgba(0,0,0,0.8); color: #0f0; padding: 10px;
            font-family: monospace; font-size: 10px; z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="btn-start">ACTIVAR REALITAT AUGMENTADA</button>
        <p style="color:white; font-size:12px; margin-top:10px;">Cal connexió HTTPS i acceptar permisos de càmera i moviment.</p>
    </div>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>

    <div id="ar-overlay">
        <canvas id="ar-canvas"></canvas>
    </div>

    <div id="debug">Esperant interacció...</div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('ar-canvas');
        const ctx = canvas.getContext('2d');
        const debug = document.getElementById('debug');
        const btnStart = document.getElementById('btn-start');
        const overlay = document.getElementById('ar-overlay');

        const points = [
            { id: 1, name: "Esglèsia Vella", lat: 41.396712, lon: 1.103376, color: '#FF0000' },
            { id: 2, name: "Ermita", lat: 41.3731, lon: 1.11065, color: '#00FF00' },
            { id: 9, name: "Tarragona", lat: 41.113685, lon: 1.256539, color: 'coral' },
            { id: 10, name: "Lleida", lat: 41.615100, lon: 0.627411, color: 'coral' }
        ];

        let userCoords = null;
        let userHeading = null;

        function updateDebug(msg) {
            debug.innerHTML = msg;
            console.log(msg);
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                updateDebug("Càmera OK. Buscant sensors...");
            } catch (err) {
                updateDebug("Error càmera: " + err.message);
            }
        }

        function initLocation() {
            navigator.geolocation.watchPosition(
                pos => { userCoords = pos.coords; },
                err => { updateDebug("Error GPS: " + err.message); },
                { enableHighAccuracy: true }
            );
        }

        async function initSensors() {
            // Per a iOS 13+ cal demanar permís explícit
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                    } else {
                        updateDebug("Permís de moviment denegat.");
                    }
                } catch (e) {
                    updateDebug("Error en demanar permís: " + e);
                }
            } else {
                // Android i navegadors antics
                window.addEventListener('deviceorientation', handleOrientation, true);
                updateDebug("Sensor configurat (Android/Legacy).");
            }
        }

        function handleOrientation(e) {
            // Prioritat al rumb absolut (brúixola)
            if (e.webkitCompassHeading) {
                userHeading = e.webkitCompassHeading;
            } else if (e.absolute && e.alpha !== null) {
                userHeading = 360 - e.alpha;
            }

            if (userHeading !== null) render();
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            const rad = d => d * Math.PI / 180;
            const y = Math.sin(rad(lon2 - lon1)) * Math.cos(rad(lat2));
            const x = Math.cos(rad(lat1)) * Math.sin(rad(lat2)) - Math.sin(rad(lat1)) * Math.cos(rad(lat2)) * Math.cos(rad(lon2 - lon1));
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function render() {
            if (!userCoords || userHeading === null) return;

            // Netejar canvas i etiquetes
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.querySelectorAll('.poi').forEach(p => p.remove());

            const fov = 70;
            const w = canvas.width = window.innerWidth;
            const h = canvas.height = window.innerHeight;

            points.forEach(p => {
                const bearing = getBearing(userCoords.latitude, userCoords.longitude, p.lat, p.lon);
                let diff = bearing - userHeading;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;

                if (Math.abs(diff) < fov / 2) {
                    const x = (w / 2) + (diff * (w / fov));
                    const y = h * 0.5;

                    // Dibuixar línia al terra (fins a la base de la pantalla)
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x, h);
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    // Etiqueta HTML
                    const el = document.createElement('div');
                    el.className = 'poi';
                    el.style.left = x + 'px';
                    el.style.top = (y - 10) + 'px';
                    el.style.backgroundColor = p.color;
                    el.innerText = p.name;
                    overlay.appendChild(el);
                }
            });

            updateDebug(`GPS: OK | Rumb: ${Math.round(userHeading)}° | Visibles: ${document.querySelectorAll('.poi').length}`);
        }

        btnStart.onclick = () => {
            document.getElementById('controls').style.display = 'none';
            initCamera();
            initLocation();
            initSensors();
        };

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
    </script>
</body>
</html>
