<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RA Fix Sensors</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
        .poi { position: absolute; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 10px; font-size: 14px; transform: translate(-50%, -100%); border: 1px solid white; }
        #overlay-start { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; pointer-events: auto; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; border-radius: 50px; border: none; background: #28a745; color: white; font-weight: bold; }
        #debug { position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #0f0; padding: 10px; font-family: monospace; font-size: 11px; z-index: 10; max-width: 80%; }
    </style>
</head>
<body>

    <div id="overlay-start">
        <h2>REALITAT AUGMENTADA</h2>
        <p>1. Utilitza <b>HTTPS</b><br>2. Accepta permisos de càmera<br>3. Mou el mòbil en cercles</p>
        <button id="btn-init">COMENÇAR</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="ar-canvas"></canvas>
    <div id="ui"></div>
    <div id="debug">Inicia per provar sensors...</div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('ar-canvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const debug = document.getElementById('debug');
        const btnInit = document.getElementById('btn-init');

        const points = [
            { name: "Tarragona", lat: 41.113, lon: 1.256, color: '#ff7f50' },
            { name: "Lleida", lat: 41.615, lon: 0.627, color: '#00ced1' },
            { name: "Poblet", lat: 41.380, lon: 1.083, color: '#32cd32' }
        ];

        let userLoc = null;
        let heading = null;

        async function start() {
            document.getElementById('overlay-start').style.display = 'none';

            // 1. Càmera
            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            } catch (e) { debug.innerText = "Error Càmera: " + e.message; }

            // 2. GPS
            navigator.geolocation.watchPosition(p => { userLoc = p.coords; }, e => { debug.innerText = "Error GPS: " + e.message; });

            // 3. Sensors (Android + iOS)
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const res = await DeviceOrientationEvent.requestPermission();
                    if (res === 'granted') window.addEventListener('deviceorientation', handleRot);
                } else {
                    // Android sol demanar deviceorientationabsolute per al nord real
                    window.addEventListener('deviceorientationabsolute', handleRot, true);
                    window.addEventListener('deviceorientation', handleRot, true);
                }
            } else {
                debug.innerText = "El teu navegador no suporta sensors.";
            }
        }

        function handleRot(e) {
            // Intentem obtenir el nord real (alpha en absolute o webkitCompass)
            heading = e.webkitCompassHeading || (e.absolute ? 360 - e.alpha : null);

            if (heading === null && e.alpha !== null) heading = 360 - e.alpha; // Fallback

            if (heading !== null) {
                debug.innerText = `SENSORS OK! Rumb: ${Math.round(heading)}°`;
                draw();
            } else {
                debug.innerText = "Sensor detectat però no envia dades (mou el mòbil!)";
            }
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            const dL = (lon2 - lon1) * Math.PI / 180;
            const l1 = lat1 * Math.PI / 180, l2 = lat2 * Math.PI / 180;
            const y = Math.sin(dL) * Math.cos(l2);
            const x = Math.cos(l1) * Math.sin(l2) - Math.sin(l1) * Math.cos(l2) * Math.cos(dL);
            return (Math.toDegrees(Math.atan2(y, x)) + 360) % 360;
        }
        Math.toDegrees = r => r * 180 / Math.PI;

        function draw() {
            if (!userLoc || heading === null) return;

            const w = canvas.width = window.innerWidth;
            const h = canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, w, h);
            ui.innerHTML = '';

            points.forEach(p => {
                const b = getBearing(userLoc.latitude, userLoc.longitude, p.lat, p.lon);
                let diff = b - heading;
                if (diff > 180) diff -= 360; if (diff < -180) diff += 360;

                if (Math.abs(diff) < 35) { // Camp de visió
                    const x = (w / 2) + (diff * (w / 70));
                    const y = h * 0.5;

                    // Línia
                    ctx.beginPath();
                    ctx.moveTo(x, y); ctx.lineTo(x, h);
                    ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.stroke();

                    // Etiqueta
                    const div = document.createElement('div');
                    div.className = 'poi';
                    div.style.left = x + 'px'; div.style.top = y + 'px';
                    div.innerText = p.name;
                    ui.appendChild(div);
                }
            });
        }

        btnInit.onclick = start;
    </script>
</body>
</html>
