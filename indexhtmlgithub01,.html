<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totes les URL de Xarxa-1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f6f8fa;
      color: #24292e;
    }
    h1 {
      color: #0366d6;
      border-bottom: 1px solid #e1e4e8;
      padding-bottom: 10px;
    }
    #status {
      margin-bottom: 15px;
      font-weight: bold;
      color: #586069;
    }
    ul {
      background: white;
      padding: 20px 40px;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      list-style-type: square;
    }
    li {
      margin-bottom: 10px;
      word-break: break-all;
    }
    a {
      color: #0366d6;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .ext {
      font-size: 0.8em;
      background-color: #f1f3f5;
      color: #495057;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 8px;
    }
    .branch {
      font-size: 0.75em;
      background-color: #dafbe1;
      color: #1a7f37;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <h1>Totes les URL de https://xarxa-1.github.io/Xarxa-1/</h1>
  <div id="status">Cercant arxius a totes les branques (gh-pages, main, master)...</div>
  <ul id="llista"></ul>

  <script>
    const user = 'Xarxa-1';
    const repo = 'Xarxa-1';
    const baseUrl = `https://${user}.github.io/${repo}/`;

    async function carregarTotesLesBranques() {
      const status = document.getElementById('status');
      const ul = document.getElementById('llista');

      try {
        // 1. Obtenir la llista de totes les branques del repositori
        const branchesRes = await fetch(`https://api.github.com/repos/${user}/${repo}/branches`);
        if (!branchesRes.ok) throw new Error('No s\'han pogut trobar les branques.');
        
        const branches = await branchesRes.json();
        const totsArxius = new Map(); // Per evitar duplicats entre branques

        // 2. Recórrer cada branca (incloent gh-pages, main, master)
        for (const branch of branches) {
          const branchName = branch.name;
          const treeRes = await fetch(`https://api.github.com/repos/${user}/${repo}/git/trees/${branchName}?recursive=1`);
          
          if (treeRes.ok) {
            const treeData = await treeRes.json();
            
            if (treeData.tree) {
              treeData.tree.forEach(item => {
                // Només guardem arxius (no carpetes) i excloem la carpeta oculta .github
                if (item.type === 'blob' && !item.path.startsWith('.')) {
                  if (!totsArxius.has(item.path)) {
                    totsArxius.set(item.path, branchName);
                  }
                }
              });
            }
          }
        }

        if (totsArxius.size === 0) {
          status.textContent = 'No s\'han trobat arxius a cap branca.';
          return;
        }

        status.textContent = `S'han trobat ${totsArxius.size} URL d'arxius en total:`;

        // 3. Mostrar la llista d'URL a la pàgina
        totsArxius.forEach((branchName, path) => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          
          const urlPublica = baseUrl + path;
          
          a.href = urlPublica;
          a.textContent = urlPublica;
          a.target = '_blank';
          
          const ext = path.includes('.') ? path.split('.').pop().toUpperCase() : 'FILE';
          
          const badgeExt = document.createElement('span');
          badgeExt.className = 'ext';
          badgeExt.textContent = ext;

          const badgeBranch = document.createElement('span');
          badgeBranch.className = 'branch';
          badgeBranch.textContent = branchName;

          li.appendChild(a);
          li.appendChild(badgeExt);
          li.appendChild(badgeBranch);
          ul.appendChild(li);
        });

      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      }
    }

    carregarTotesLesBranques();
  </script>
</body>
</html>
