<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totes les URL de Xarxa-1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f6f8fa;
      color: #24292e;
    }
    h1 {
      color: #0366d6;
      border-bottom: 1px solid #e1e4e8;
      padding-bottom: 10px;
    }
    #status {
      margin-bottom: 15px;
      font-weight: bold;
      color: #586069;
    }
    ul {
      background: white;
      padding: 20px 40px;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      list-style-type: square;
    }
    li {
      margin-bottom: 10px;
      word-break: break-all;
    }
    a {
      color: #0366d6;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .ext {
      font-size: 0.8em;
      background-color: #f1f3f5;
      color: #495057;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 8px;
    }
  </style>
</head>
<body>00000000000000000

  <h1>Totes les URL de https://xarxa-1.github.io/Xarxa-1/</h1>
  <div id="status">Cercant tots els arxius del repositori...</div>
  <ul id="llista"></ul>

  <script>
    const user = 'Xarxa-1';
    const repo = 'Xarxa-1';
    const baseUrl = `https://${user}.github.io/${repo}/`;

    async function carregarArxius() {
      const status = document.getElementById('status');
      const ul = document.getElementById('llista');

      try {
        // 1. Obtenir informació del repositori per saber quina és la branca principal per defecte
        const repoRes = await fetch(`https://api.github.com/repos/${user}/${repo}`);
        if (!repoRes.ok) throw new Error('No s\'ha trobat el repositori.');
        
        const repoData = await repoRes.json();
        const defaultBranch = repoData.default_branch || 'main';

        // 2. Demanar l'arbre d'arxius complet de la branca detectada
        const treeRes = await fetch(`https://api.github.com/repos/${user}/${repo}/git/trees/${defaultBranch}?recursive=1`);
        if (!treeRes.ok) throw new Error('No s\'han pogut llegir els arxius de la branca ' + defaultBranch);
        
        const treeData = await treeRes.json();

        // 3. Filtrar només els fitxers (excloent carpetes i la carpeta oculta .github)
        const items = treeData.tree.filter(item => {
          return item.type === 'blob' && !item.path.startsWith('.');
        });

        status.textContent = `S'han trobat ${items.length} URL d'arxius:`;

        // 4. Mostrar els resultats a la llista
        items.forEach(item => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          
          const urlPublica = baseUrl + item.path;
          
          a.href = urlPublica;
          a.textContent = urlPublica;
          a.target = '_blank';
          
          const ext = item.path.includes('.') ? item.path.split('.').pop().toUpperCase() : 'FILE';
          const badge = document.createElement('span');
          badge.className = 'ext';
          badge.textContent = ext;

          li.appendChild(a);
          li.appendChild(badge);
          ul.appendChild(li);
        });

      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      }
    }

    carregarArxius();
  </script>
</body>
</html>
