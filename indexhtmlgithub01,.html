<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>*** Llista de URL de radiopen9</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    h1 {
      color: #0056b3;
    }
    .status {
      font-style: italic;
      color: #666;
      margin-bottom: 15px;
    }
    ul {
      background: white;
      padding: 20px 40px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      word-break: break-all;
    }
    li {
      margin-bottom: 8px;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>URL trobades a radiopen9.html</h1>
  <div id="status" class="status">Carregant i analitzant la pàgina...</div>
  <ul id="url-list"></ul>

  <script>
    const targetUrl = 'https://xarxa-1.github.io/Xarxa-1/radiopen9.html';
    
    // Fem servir api.allorigins.win per evitar problemes de restricció CORS
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

    async function fetchAndExtractURLs() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('url-list');

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('No s\'ha pogut accedir a la pàgina.');
        
        const data = await response.json();
        const htmlContent = data.contents;

        // Parsejem l'HTML rebut
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlContent, 'text/html');

        const foundUrls = new Set();

        // 1. Extreure atributs HTML típics que contenen URL (href, src, action)
        const elementsWithUrls = doc.querySelectorAll('[href], [src], [action]');
        elementsWithUrls.forEach(el => {
          const url = el.getAttribute('href') || el.getAttribute('src') || el.getAttribute('action');
          if (url && !url.startsWith('javascript:') && !url.startsWith('#')) {
            foundUrls.add(toAbsoluteUrl(url, targetUrl));
          }
        });

        // 2. Cercar patrons de URL (com streams de ràdio http/https) dins del text o codi JavaScript
        const urlRegex = /(https?:\/\/[^\s"'<>]+)/g;
        let match;
        while ((match = urlRegex.exec(htmlContent)) !== null) {
          // Netejem possibles caràcters addicionals al final de la URL
          let cleanUrl = match[0].replace(/[;,)]*$/, '');
          foundUrls.add(cleanUrl);
        }

        // Mostrar els resultats
        statusEl.textContent = `S'han trobat ${foundUrls.size} URL úniques:`;
        
        Array.from(foundUrls).sort().forEach(url => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = url;
          a.textContent = url;
          a.target = '_blank';
          li.appendChild(a);
          listEl.appendChild(li);
        });

      } catch (error) {
        statusEl.textContent = 'Error en carregar les URL: ' + error.message;
      }
    }

    // Funció per convertir rutes meitat-relatives a URL absolutes
    function toAbsoluteUrl(url, base) {
      try {
        return new URL(url, base).href;
      } catch (e) {
        return url;
      }
    }

    fetchAndExtractURLs();
  </script>
</body>
</html>
