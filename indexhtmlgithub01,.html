<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índex de Projectes - Xarxa 1</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f6f8fa;
            color: #24292f;
        }
        h1 {
            border-bottom: 2px solid #d0d7de;
            padding-bottom: 12px;
            font-size: 24px;
        }
        ul {
            list-style: none;
            padding: 0;
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
        }
        li {
            border-bottom: 1px solid #d0d7de;
            padding: 12px 16px;
        }
        li:last-child {
            border-bottom: none;
        }
        a {
            color: #0969da;
            text-decoration: none;
            font-weight: 500;
            display: block;
        }
        a:hover {
            text-decoration: underline;
        }
        .error { color: #cf222e; font-weight: bold; }
        .loading { color: #57606a; font-style: italic; }
    </style>
</head>
<body>

    <h1>🗂️ Índex de fitxers HTML</h1>
    <ul id="llista-fitxers">
        <li class="loading">Carregant la llista de pàgines des de GitHub...</li>
    </ul>

    <script>
        const USUARI = "xarxa-1";
        const REPOSITORI = "Xarxa-1";
        const CARPETA = ""; 

        // Utilitzem l'API estàndard v3 de GitHub
        const apiUrl = `https://github.com{USUARI}/${REPOSITORI}/contents/${CARPETA}`;

        async function carregarHTMLs() {
            const llista = document.getElementById('llista-fitxers');
            
            try {
                // Afegim paràmetres i capçaleres per evitar problemes de CORS o bloquejos
                const resposta = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'User-Agent': 'GitHubPagesIndex' // Identifica la petició
                    }
                });
                
                if (!resposta.ok) {
                    throw new Error(`Servidor de GitHub ha respost amb codi ${resposta.status}`);
                }

                const fitxers = await resposta.json();
                llista.innerHTML = ""; 

                fitxers.forEach(fitxer => {
                    // Filtrem només els fitxers .html excepte l'index
                    if (fitxer.type === 'file' && fitxer.name.endsWith('.html') && fitxer.name !== 'index.html') {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        
                        // Generem l'enllaç dinàmic adaptat per si es visita online o local
                        a.href = `./${fitxer.name}`; 
                        a.textContent = fitxer.name;
                        
                        li.appendChild(a);
                        llista.appendChild(li);
                    }
                });

                if (llista.children.length === 0) {
                    llista.innerHTML = "<li>No s'ha trobat cap altre fitxer HTML en aquest repositori.</li>";
                }

            } catch (error) {
                // Si l'API falla, oferim informació detallada
                llista.innerHTML = `
                    <li class="error">❌ Error: ${error.message}</li>
                    <li style="color: #57606a; font-size: 13px;">
                        Aquest error pot passar si el navegador té un <strong>bloquejador d'anuncis o tracker</strong> molt estricte, 
                        o si l'API de GitHub ha superat el límit temporal de consultes des de la teva IP. 
                        Prova d'obrir la pàgina en una finestra d'incògnit.
                    </li>
                `;
            }
        }

        carregarHTMLs();
    </script>

</body>
</html>
