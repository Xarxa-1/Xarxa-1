<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index Xarxa-1</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f9f9f9; }
    h1 { color: #0366d6; }
    ul { background: white; padding: 20px; border-radius: 8px; list-style-type: square; }
    li { margin-bottom: 8px; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
999999999999999999999999999999999999
  <h1>Arxius a https://xarxa-1.github.io/Xarxa-1/</h1>
  <div id="status">Carregant llista d'arxius...</div>
  <ul id="llista"></ul>

  <script>
    // Carrega directament la llista d'arxius des de l'API de GitHub
    fetch('https://api.github.com/repos/Xarxa-1/Xarxa-1/contents/')
      .then(res => {
        if (!res.ok) throw new Error('El repositori no és públic o no existeix.');
        return res.json();
      })
      .then(data => {
        document.getElementById('status').style.display = 'none';
        const ul = document.getElementById('llista');
        
        data.forEach(item => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          // Genera la URL pública de GitHub Pages
          const urlPublica = `https://xarxa-1.github.io/Xarxa-1/${item.name}`;
          
          a.href = urlPublica;
          a.textContent = urlPublica;
          a.target = '_blank';
          
          li.appendChild(a);
          ul.appendChild(li);
        });
      })
      .catch(err => {
        document.getElementById('status').textContent = 'Nota: ' + err.message + ' Utilitza l\'Opció A per indicar els enllaços manualment.';
      });
  </script>
</body>
</html>
