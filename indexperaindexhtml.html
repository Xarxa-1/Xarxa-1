<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Índex de Fitxers HTML</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 800px; }
    h1 { color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { margin: 8px 0; }
    a { color: #0969da; text-decoration: none; font-size: 1.1rem; }
    a:hover { text-decoration: underline; }
    .debug { background: #f6f8fa; padding: 1rem; border-radius: 6px; border: 1px solid #d0d7de; font-family: monospace; font-size: 0.9rem; margin-top: 1rem; }
  </style>
</head>
<body>

  <h1>Índex de pàgines HTML</h1>
  <p id="status">Inspectant el repositori...</p>
  <ul id="html-list"></ul>
  
  <div id="debug-box" class="debug" style="display:none;">
    <strong>Tots els elements trobats al repositori:</strong>
    <ul id="debug-list"></ul>
  </div>

  <script>
    const USERNAME = "Xarxa-1";
    const REPO = "Xarxa-1";
    const BRANCH = "gh-pages";

    // Petició per veure TOTS els fitxers de totes les carpetes
    const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`;

    async function inspectRepo() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("html-list");
      const debugBox = document.getElementById("debug-box");
      const debugList = document.getElementById("debug-list");

      try {
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          throw new Error(`Codi HTTP ${response.status}`);
        }

        const data = await response.json();
        statusEl.style.display = "none";
        debugBox.style.display = "block";

        if (!data.tree || data.tree.length === 0) {
          debugList.innerHTML = "<li>No s'ha trobat cap element a l'arbre del repositori.</li>";
          return;
        }

        let htmlCount = 0;

        // Recorrem absolutament tots els elements
        data.tree.forEach(item => {
          // Mostrem l'element a la caixa de diagnòstic
          const debugLi = document.createElement("li");
          debugLi.textContent = `[Tipus: ${item.type}] -> ${item.path}`;
          debugList.appendChild(debugLi);

          // Si acaba en html (o qualsevol variant), el posem a la llista principal
          if (item.type === "blob" && item.path.toLowerCase().includes("html")) {
            htmlCount++;
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = item.path;
            a.textContent = item.path;
            li.appendChild(a);
            listEl.appendChild(li);
          }
        });

        if (htmlCount === 0) {
          listEl.innerHTML = "<li>No s'ha detectat cap fitxer que contingui 'html' al nom.</li>";
        }

      } catch (error) {
        statusEl.textContent = "Error en llegir el repositori: " + error.message;
      }
    }

    inspectRepo();
  </script>
</body>
</html>
