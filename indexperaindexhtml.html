<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Índex de Fitxers HTML</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 800px; }
    h1 { color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { margin: 8px 0; }
    a { color: #0969da; text-decoration: none; font-size: 1.1rem; }
    a:hover { text-decoration: underline; }
    .loading { color: #666; font-style: italic; }
    .error { color: #d9381e; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Índex de pàgines HTML</h1>
  <p class="loading" id="status">Carregant fitxers...</p>
  <ul id="html-list"></ul>

  <script>
    const USERNAME = "Xarxa-1";
    const REPO = "Xarxa-1";
    const BRANCH = "gh-pages";

    // Utilitzem l'API de Trees amb recursive=1 per cercar dins de TOTES les carpetes (com 'msx')
    const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`;

    async function fetchHtmlFiles() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("html-list");

      try {
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          throw new Error(`Error en connectar amb GitHub (Codi ${response.status}).`);
        }

        const data = await response.json();

        // data.tree conté tots els fitxers del repositori i les seves carpetes
        const htmlFiles = data.tree.filter(item => {
          const pathLower = item.path.toLowerCase();
          const fileName = item.path.split('/').pop().toLowerCase();
          
          return (
            item.type === "blob" && 
            pathLower.endsWith(".html") && 
            fileName !== "index.html" &&
            fileName !== "indexperaindexhtml.html"
          );
        });

        statusEl.style.display = "none";

        if (htmlFiles.length === 0) {
          listEl.innerHTML = "<li>No s'han trobat arxius HTML al repositori.</li>";
          return;
        }

        htmlFiles.forEach(file => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          
          // file.path serà per exemple "msx/radiopen9.html"
          a.href = file.path;
          
          // Formatem el nom per mostrar la carpeta i el nom del fitxer ben explicat
          const cleanName = file.path.replace(/\.html$/i, "").replace(/-/g, " ");
          a.textContent = cleanName;
          
          li.appendChild(a);
          listEl.appendChild(li);
        });

      } catch (error) {
        statusEl.className = "error";
        statusEl.textContent = "Error: " + error.message;
      }
    }

    fetchHtmlFiles();
  </script>
</body>
</html>
