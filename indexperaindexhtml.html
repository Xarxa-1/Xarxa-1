<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Índex de Fitxers HTML</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 800px; }
    h1 { color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { margin: 8px 0; }
    a { color: #0969da; text-decoration: none; font-size: 1.1rem; }
    a:hover { text-decoration: underline; }
    .loading { color: #666; font-style: italic; }
    .error { color: #d9381e; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Índex de pàgines HTML</h1>
  <p class="loading" id="status">Carregant fitxers...</p>
  <ul id="html-list"></ul>

  <script>
    // Dades del teu compte configurades:
    const USERNAME = 'Xarxa-1';
    const REPO = 'Xarxa-1';
    const FOLDER_PATH = ''; // Si els HTML estan a l'arrel

    const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER_PATH}`;

    async function fetchHtmlFiles() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('html-list');

      try {
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error(`No s'ha trobat el repositori "${USERNAME}/${REPO}". Revisa que sigui PÚBLIC i que el nom estigui ben escrit.`);
          } else if (response.status === 403) {
            throw new Error("S'ha superat el límit de consultes a l'API de GitHub per hora. Espera uns minuts.");
          } else {
            throw new Error(`Error de la xarxa (Codi HTTP ${response.status}).`);
          }
        }

        const files = await response.json();

        // Filtrem només els fitxers .html (excloent index.html)
        const htmlFiles = files.filter(file => 
          file.type === 'file' && 
          file.name.endsWith('.html') && 
          file.name !== 'index.html'
        );

        statusEl.style.display = 'none';

        if (htmlFiles.length === 0) {
          listEl.innerHTML = '<li>No s'han trobat altres fitxers .html en aquest repositori.</li>';
          return;
        }

        htmlFiles.forEach(file => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          
          a.href = file.name;
          a.textContent = file.name.replace('.html', '').replace(/-/g, ' ');
          
          li.appendChild(a);
          listEl.appendChild(li);
        });

      } catch (error) {
        statusEl.className = 'error';
        statusEl.textContent = '⚠️ ' + error.message;
      }
    }

    fetchHtmlFiles();
  </script>
</body>
</html>
