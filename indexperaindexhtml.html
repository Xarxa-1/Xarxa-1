<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Índex de Fitxers HTML</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 800px; }
    h1 { color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { margin: 8px 0; }
    a { color: #0969da; text-decoration: none; font-size: 1.1rem; }
    a:hover { text-decoration: underline; }
    .loading { color: #666; font-style: italic; }
    .error { color: #d9381e; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Índex de pàgines HTML</h1>
  <p class="loading" id="status">Carregant fitxers...</p>
  <ul id="html-list"></ul>

  <script>
    const USERNAME = "Xarxa-1";
    const REPO = "Xarxa-1";
    const FOLDER_PATH = "";
    
    // ⚠️ Indiquem a l'API que busqui a la branca 'gh-pages'
    const BRANCH = "gh-pages";

    const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER_PATH}?ref=${BRANCH}`;

    async function fetchHtmlFiles() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("html-list");

      try {
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error(`No s'ha trobat la branca "${BRANCH}" o el repositori "${USERNAME}/${REPO}".`);
          } else if (response.status === 403) {
            throw new Error("S'ha superat el límit de consultes a l'API de GitHub per hora.");
          } else {
            throw new Error(`Error de la xarxa (Codi HTTP ${response.status}).`);
          }
        }

        const files = await response.json();

        // Filtrem els fitxers .html i excloem els index
        const htmlFiles = files.filter(file => {
          const fileNameLower = file.name.toLowerCase();
          return (
            file.type === "file" && 
            fileNameLower.endsWith(".html") && 
            fileNameLower !== "index.html" &&
            fileNameLower !== "indexperaindexhtml.html"
          );
        });

        statusEl.style.display = "none";

        if (htmlFiles.length === 0) {
          const allFileNames = files.map(f => f.name).join(", ");
          listEl.innerHTML = `<li>No s'han trobat altres fitxers HTML a la branca ${BRANCH}.</li>
                              <li style="color:#777; margin-top:1rem; font-size:0.9rem;">
                                <strong>Fitxers trobats:</strong> ${allFileNames || 'cap'}
                              </li>`;
          return;
        }

        htmlFiles.forEach(file => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          
          a.href = file.name;
          a.textContent = file.name.replace(/\.html$/i, "").replace(/-/g, " ");
          
          li.appendChild(a);
          listEl.appendChild(li);
        });

      } catch (error) {
        statusEl.className = "error";
        statusEl.textContent = "Error: " + error.message;
      }
    }

    fetchHtmlFiles();
  </script>
</body>
</html>
