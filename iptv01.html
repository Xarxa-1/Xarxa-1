<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob:; media-src * blob: data:;">
    <title>Xarxa-1 IPTV Player Auto Subs</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #000; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; color: #fff; }
        
        .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: contain; }

        #splash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 99; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #splash-screen img { max-width: 250px; margin-bottom: 20px; border-radius: 10px; }

        .ui-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 70%, rgba(0,0,0,0));
            z-index: 10;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }
        .ui-overlay.show { transform: translateY(0); }

        .main-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .info-left-side { display: flex; align-items: center; gap: 25px; flex-grow: 1; overflow: hidden; }
        .channel-brand { display: flex; align-items: center; gap: 15px; min-width: 200px; flex-shrink: 0; }
        .has-epg .channel-brand { border-right: 1px solid rgba(255,255,255,0.1); padding-right: 10px; }
        
        .channel-logo { width: 60px; height: 60px; object-fit: contain; }
        .channel-name-txt { font-size: 1.6rem; font-weight: bold; color: #ff9800; }

        .epg-content { display: none; flex-direction: column; flex-grow: 1; overflow: hidden; }
        .has-epg .epg-content { display: flex; }

        .epg-top { display: flex; align-items: center; gap: 10px; }
        .epg-time { font-size: 1rem; color: #aaa; font-weight: bold; flex-shrink: 0; }
        .epg-title { font-size: 1.3rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .epg-desc { font-size: 0.95rem; color: #ccc; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .controls-row { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        
        .nav-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 2px solid transparent;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .nav-btn:focus { background: #fff; color: #000; border-color: #ff9800; outline: none; transform: scale(1.1); }

        .vol-btn { background: rgba(255, 152, 0, 0.2); color: #ff9800; font-weight: bold; }
        .vol-btn:focus { background: #ff9800; color: #fff; }

        .modal-menu { 
            position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); 
            background: rgba(20,20,20,0.98); border: 2px solid #444; border-radius: 12px; 
            padding: 20px; min-width: 300px; max-height: 400px; overflow-y: auto; 
            z-index: 99; display: none; flex-direction: column; 
        }
        .modal-menu.show { display: flex; }
        .modal-menu h3 { font-size: 1.1rem; color: #ff9800; text-align: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        .menu-container { display: flex; flex-direction: column; gap: 10px; }

        .menu-item {
            width: 100%; background: rgba(255,255,255,0.1); color: white; border: 2px solid transparent;
            padding: 12px; border-radius: 8px; font-size: 1rem; text-align: left; cursor: pointer;
        }
        .menu-item:focus { background: #fff; color: #000; border-color: #ff9800; outline: none; }

        #current-date { position: absolute; top: 40px; left: 40px; font-size: 1.2rem; font-weight: bold; color: rgba(255,255,255,0.6); z-index: 5; }
    </style>
</head>
<body>

    <div id="current-date">00:00</div>

    <div id="splash-screen">
        <img src="https://xarxa-1.github.io/Xarxa-1/logoiptv.jpeg" alt="Logo">
        <h2 id="splash-text">Carregant llistes...</h2>
        <p id="splash-sub" style="margin-top:10px; color:#aaa; display:none;">Prem OK per començar</p>
    </div>

    <div class="video-container">
        <video id="video-player" autoplay playsinline crossorigin="anonymous"></video>
    </div>

    <div class="modal-menu" id="audio-menu"><h3>Àudio</h3><div class="menu-container"></div></div>
    <div class="modal-menu" id="subs-menu"><h3>Subtítols</h3><div class="menu-container"></div></div>
    <div class="modal-menu" id="groups-menu"><h3>Grups</h3><div class="menu-container"></div></div>

    <div class="ui-overlay" id="ui-overlay">
        <div class="main-info-row" id="info-row-box">
            <div class="info-left-side">
                <div class="channel-brand">
                    <img class="channel-logo" id="ch-logo" src="" alt="">
                    <div class="channel-name-txt" id="ch-name">Nom Canal</div>
                </div>
                <div class="epg-content" id="epg-visual-box">
                    <div class="epg-top">
                        <span class="epg-time" id="epg-time">--:--</span>
                        <span class="epg-title" id="epg-title">Programa</span>
                    </div>
                    <div class="epg-desc" id="epg-desc">Descripció</div>
                </div>
            </div>
            
            <div class="controls-row">
                <button class="nav-btn vol-btn" id="btn-voldown" data-action="voldown" title="Baixar Volum">➖</button>
                <button class="nav-btn vol-btn" id="btn-volup" data-action="volup" title="Apujar Volum">➕</button>
                <button class="nav-btn" id="btn-audio" data-action="audio" title="Àudio">🔊</button>
                <button class="nav-btn" id="btn-subs" data-action="subs" title="Subtítols">💬</button>
                <button class="nav-btn" id="btn-groups" data-action="groups" title="Grups">☰</button>
            </div>
        </div>
    </div>

    <script>
        const M3U_URL = "https://xarxa-1.github.io/Xarxa-1/cat325.m3u";
        const EPG_URL = "https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/EPG_dobleM.xml";
        const DEFAULT_LOGO = "https://xarxa-1.github.io/Xarxa-1/negre.jpg";

        let allChannels = [], filteredChannels = [], groups = new Set(["Tots els canals"]);
        let epgData = {}, currentChannelIndex = 0, selectedChannelIndex = 0;
        let uiTimeout = null, hlsInstance = null, activeMenuId = null;
        let isLoaded = false;

        const video = document.getElementById('video-player');
        const overlay = document.getElementById('ui-overlay');
        const splash = document.getElementById('splash-screen');

        function cleanEpgText(text) {
            if (!text) return '';
            return text.replace(/\[\/?COLOR[^\]]*\]/gi, '').replace(/<\/?[^>]+(>|$)/g, '').trim();
        }

        function cleanId(str) {
            if (!str) return '';
            return str.toLowerCase().replace(/\.cat|\.es|\.org|\.com/g, '').replace(/[^a-z0-9]/g, '');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            initClock();
            try {
                await parseM3U();
                await fetchEPG();
                if (allChannels.length > 0) {
                    filteredChannels = [...allChannels];
                    isLoaded = true;
                    document.getElementById('splash-text').innerText = "Llistat a punt";
                    document.getElementById('splash-sub').style.display = "block";
                }
            } catch (e) { console.error(e); }
        });

        async function parseM3U() {
            const resp = await fetch(M3U_URL);
            const text = await resp.text();
            const lines = text.split('\n');
            let currentCh = {};
            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    currentCh = {};
                    let logo = line.match(/tvg-logo="([^"]+)"/);
                    currentCh.logo = (logo && logo[1]) ? logo[1] : DEFAULT_LOGO;
                    let id = line.match(/tvg-id="([^"]+)"/);
                    currentCh.id = id ? id[1] : '';
                    let grp = line.match(/group-title="([^"]+)"/);
                    let gName = grp ? grp[1] : "Altres";
                    groups.add(gName);
                    currentCh.group = gName;
                    currentCh.name = line.substring(line.lastIndexOf(',') + 1).trim();
                } else if (line.startsWith('http')) {
                    currentCh.url = line;
                    allChannels.push(currentCh);
                }
            });
        }

        async function fetchEPG() {
            try {
                const resp = await fetch(EPG_URL);
                const xml = new DOMParser().parseFromString(await resp.text(), "text/xml");
                Array.from(xml.getElementsByTagName('programme')).forEach(prog => {
                    let cid = prog.getAttribute('channel');
                    if (!cid) return;
                    let cleanedCid = cleanId(cid);
                    if (!epgData[cleanedCid]) epgData[cleanedCid] = [];
                    
                    let rawTitle = prog.getElementsByTagName('title')[0]?.textContent || '';
                    let rawDesc = prog.getElementsByTagName('desc')[0]?.textContent || '';
                    epgData[cleanedCid].push({
                        start: prog.getAttribute('start'), stop: prog.getAttribute('stop'),
                        title: cleanEpgText(rawTitle), desc: cleanEpgText(rawDesc)
                    });
                });
            } catch (e) { console.error(e); }
        }

        function playChannel(index) {
            splash.style.display = 'none';
            currentChannelIndex = index;
            selectedChannelIndex = index;
            const ch = filteredChannels[index];
            closeAllModals();
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            
            if (ch.url.startsWith('http://') || !Hls.isSupported()) {
                video.src = ch.url;
                video.play().catch(err => console.log("Canal natiu error:", err));
                video.addEventListener('loadedmetadata', () => {
                    if (video.textTracks && video.textTracks.length > 0) {
                        video.textTracks[0].mode = 'showing';
                    }
                }, { once: true });
            } else {
                hlsInstance = new Hls();
                hlsInstance.loadSource(ch.url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play();
                    if (hlsInstance.subtitleTracks && hlsInstance.subtitleTracks.length > 0) {
                        hlsInstance.subtitleTrack = 0;
                    }
                });
            }
            updateUI(ch);
            showUI();
        }

        function updateUI(ch) {
            const imgEl = document.getElementById('ch-logo');
            imgEl.src = ch.logo;
            imgEl.onerror = () => imgEl.src = DEFAULT_LOGO;
            document.getElementById('ch-name').innerText = ch.name;
            
            let cleanChId = cleanId(ch.id);
            let cleanChName = cleanId(ch.name);
            let list = epgData[cleanChId] || epgData[cleanChName] || [];
            let now = new Date();
            let prog = list.find(p => {
                let s = new Date(p.start.substring(0,4), p.start.substring(4,6)-1, p.start.substring(6,8), p.start.substring(8,10), p.start.substring(10,12));
                let e = new Date(p.stop.substring(0,4), p.stop.substring(4,6)-1, p.stop.substring(6,8), p.stop.substring(8,10), p.stop.substring(10,12));
                return now >= s && now <= e;
            });

            const rowBox = document.getElementById('info-row-box');
            if (prog) {
                rowBox.classList.add('has-epg');
                document.getElementById('epg-title').innerText = prog.title;
                document.getElementById('epg-desc').innerText = prog.desc;
                document.getElementById('epg-time').innerText = `${prog.start.substring(8,10)}:${prog.start.substring(10,12)} - ${prog.stop.substring(8,10)}:${prog.stop.substring(10,12)}`;
            } else {
                rowBox.classList.remove('has-epg');
                document.getElementById('epg-title').innerText = "";
                document.getElementById('epg-desc').innerText = "";
                document.getElementById('epg-time').innerText = "--:--";
            }
        }

        function showUI() {
            overlay.classList.add('show');
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => { 
                overlay.classList.remove('show'); 
                closeAllModals();
                selectedChannelIndex = currentChannelIndex; 
                updateUI(filteredChannels[currentChannelIndex]);
                if (document.activeElement) document.activeElement.blur(); 
            }, 6000);
        }

        function closeAllModals() { activeMenuId = null; document.querySelectorAll('.modal-menu').forEach(m => m.classList.remove('show')); }

        function initClock() {
            setInterval(() => {
                const n = new Date();
                document.getElementById('current-date').innerText = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
            }, 1000);
        }

        function changeVolume(amount) {
            let targetVol = video.volume + amount;
            if (targetVol > 1) targetVol = 1;
            if (targetVol < 0) targetVol = 0;
            video.volume = targetVol;
            showUI();
            setTimeout(() => { if(document.activeElement) document.activeElement.blur(); }, 100);
        }

        window.addEventListener('keydown', (e) => {
            const code = e.keyCode || e.which;

            if (e.key === "VolumeUp" || code === 175 || code === 447) {
                e.preventDefault(); changeVolume(0.1); return;
            }
            if (e.key === "VolumeDown" || code === 174 || code === 448) {
                e.preventDefault(); changeVolume(-0.1); return;
            }

            if (splash.style.display !== 'none') {
                if (code === 13 && isLoaded) playChannel(0);
                return;
            }

            if (!overlay.classList.contains('show')) { showUI(); return; }
            showUI();

            switch(code) {
                case 38: // Amunt (Canvia de canal obligatori si no hi ha submenú obert)
                    e.preventDefault(); 
                    if (activeMenuId) {
                        navMenu(-1); 
                    } else {
                        // MILLORA: Treu focus de la botonera inferior i canvia de canal
                        if (document.activeElement) document.activeElement.blur();
                        navChannels(-1); 
                    }
                    break;
                case 40: // Avall (Canvia de canal obligatori si no hi ha submenú obert)
                    e.preventDefault(); 
                    if (activeMenuId) {
                        navMenu(1); 
                    } else {
                        // MILLORA: Treu focus de la botonera inferior i canvia de canal
                        if (document.activeElement) document.activeElement.blur();
                        navChannels(1); 
                    }
                    break;
                case 37: // Esquerra
                    if (!activeMenuId) navHoriz(-1); break;
                case 39: // Dreta
                    if (!activeMenuId) navHoriz(1); break;
                case 13: // OK / Enter del comandament
                    e.preventDefault();
                    if (document.activeElement && (document.activeElement.classList.contains('menu-item') || document.activeElement.classList.contains('nav-btn'))) {
                        document.activeElement.click();
                    } else if(selectedChannelIndex !== currentChannelIndex) {
                        playChannel(selectedChannelIndex);
                    } else {
                        handleBtn(document.activeElement);
                    }
                    break;
                case 27: // Enrere
                    closeAllModals(); 
                    if (document.activeElement) document.activeElement.blur();
                    break;
            }
        });

        function navChannels(dir) {
            let next = selectedChannelIndex + dir;
            if (next >= 0 && next < filteredChannels.length) {
                selectedChannelIndex = next;
                updateUI(filteredChannels[selectedChannelIndex]);
            }
        }

        function navHoriz(dir) {
            const btns = Array.from(document.querySelectorAll('.nav-btn'));
            let idx = btns.indexOf(document.activeElement);
            if (idx === -1) { btns[2].focus(); return; } // Comença enfocant el botó d'Àudio per defecte
            let next = idx + dir;
            if (next >= 0 && next < btns.length) btns[next].focus();
        }

        function navMenu(dir) {
            const items = Array.from(document.getElementById(activeMenuId).querySelectorAll('.menu-item'));
            let idx = items.indexOf(document.activeElement);
            let next = idx + dir;
            if (next >= 0 && next < items.length) items[next].focus();
        }

        function handleBtn(el) {
            const act = el ? el.getAttribute('data-action') : null;
            if (act === "audio") openMenu('audio-menu', hlsInstance?.audioTracks, 'audioTrack');
            if (act === "subs") openMenu('subs-menu', hlsInstance?.subtitleTracks, 'subtitleTrack');
            if (act === "groups") openGroups();
            if (act === "volup") changeVolume(0.1);
            if (act === "voldown") changeVolume(-0.1);
        }

        function openMenu(id, tracks, prop) {
            closeAllModals();
            activeMenuId = id;
            const cont = document.getElementById(id).querySelector('.menu-container');
            cont.innerHTML = "";
            if (!tracks || tracks.length === 0) { 
                let b = document.createElement('button');
                b.className = "menu-item";
                b.innerText = "No disponible (OK per tancar)";
                b.onclick = () => { closeAllModals(); if(document.getElementById('btn-audio')) document.getElementById('btn-audio').focus(); };
                cont.appendChild(b);
            } else {
                tracks.forEach((t, i) => {
                    let b = document.createElement('button');
                    b.className = "menu-item";
                    b.innerText = t.name || t.language || `Pista ${i+1}`;
                    b.onclick = () => { if(hlsInstance) hlsInstance[prop] = i; closeAllModals(); if(document.getElementById('btn-audio')) document.getElementById('btn-audio').focus(); };
                    cont.appendChild(b);
                });
            }
            document.getElementById(id).classList.add('show');
            setTimeout(() => { const first = cont.querySelector('.menu-item'); if(first) first.focus(); }, 150);
        }

        function openGroups() {
            closeAllModals();
            activeMenuId = 'groups-menu';
            const cont = document.getElementById('groups-menu').querySelector('.menu-container');
            cont.innerHTML = "";
            Array.from(groups).forEach(g => {
                let b = document.createElement('button');
                b.className = "menu-item";
                b.innerText = g;
                b.onclick = () => {
                    filteredChannels = g === "Tots els canals" ? [...allChannels] : allChannels.filter(c => c.group === g);
                    playChannel(0);
                };
                cont.appendChild(b);
            });
            document.getElementById('groups-menu').classList.add('show');
            setTimeout(() => { const first = cont.querySelector('.menu-item'); if(first) first.focus(); }, 150);
        }
    </script>
</body>
</html>
