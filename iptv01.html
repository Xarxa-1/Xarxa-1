<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IPTV Smart TV Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.10/hls.min.js"></script>
  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --accent:#ff9800;
      --panel:rgba(0,0,0,.72);
      --panel2:rgba(10,10,10,.92);
      --soft:rgba(255,255,255,.1);
      --soft2:rgba(255,255,255,.18);
      --focus:#fff;
      --ok:#6ee7b7;
      --danger:#ff6b6b;
      --shadow:0 10px 40px rgba(0,0,0,.55);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:var(--fg);
      overflow:hidden;
      font-family:'Segoe UI',Roboto,Arial,sans-serif;
      user-select:none;
      -webkit-user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    body{position:relative}
    video{
      position:absolute;
      inset:0;
      width:100vw;
      height:100vh;
      object-fit:fill; /* Ocupa el 100% d'amplada i alçada exactes */
      background:#000;
    }
    #clock{
      position:absolute;
      top:18px;
      left:18px;
      z-index:12;
      font-size:22px;
      letter-spacing:.08em;
      opacity:.58;
      text-shadow:0 2px 10px rgba(0,0,0,.8);
      pointer-events:none;
    }
    #splash{
      position:absolute;
      inset:0;
      z-index:30;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at center, rgba(24,24,24,.88), rgba(0,0,0,.98));
      flex-direction:column;
      gap:18px;
      transition:opacity .35s ease, transform .35s ease;
    }
    #splash.hidden{
      opacity:0;
      pointer-events:none;
      transform:scale(1.02);
    }
    #splashLogo{
      width:170px;
      height:170px;
      border-radius:26px;
      object-fit:cover;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.08);
    }
    #splashStatus{
      font-size:22px;
      font-weight:600;
      color:#fff;
    }
    /* Estil transformat a botó accessible per a pantalles tàctils o ratolins */
    #splashHint{
      font-size:18px;
      font-weight:600;
      color:var(--ok);
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(110,231,183,0.3);
      padding:10px 24px;
      border-radius:12px;
      cursor:pointer;
      outline:none;
      opacity:0;
      transform:translateY(8px);
      transition:opacity .3s ease, transform .3s ease, background .2s, border-color .2s;
    }
    #splashHint:focus, #splashHint:hover{
      background:var(--ok);
      color:#000;
      border-color:var(--ok);
    }
    #splashHint.show{
      opacity:1;
      transform:translateY(0);
    }
    #overlay{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      z-index:20;
      padding:18px 18px 20px;
      transition:transform .35s ease, opacity .35s ease;
      transform:translateY(0);
      opacity:1;
      pointer-events:none;
    }
    #overlay.hidden{
      transform:translateY(110%);
      opacity:0;
    }
    #bottomBar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:18px 20px;
      border-radius:24px;
      background:linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.55));
      box-shadow:var(--shadow);
      pointer-events:auto;
      border:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(8px);
    }
    #leftInfo{
      display:flex;
      align-items:center;
      gap:16px;
      min-width:0;
      flex:1;
    }
    .logo-btn{
      width:74px;
      height:74px;
      border-radius:18px;
      padding:0;
      background:transparent;
      border:2px solid rgba(255,255,255,.08);
      cursor:pointer;
      outline:none;
      overflow:hidden;
      flex:0 0 auto;
      transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .logo-btn:focus{
      border-color:var(--accent);
      transform:scale(1.06);
      box-shadow:0 0 0 3px rgba(255,152,0,.3);
    }
    #channelLogo{
      width:100%;
      height:100%;
      object-fit:cover;
      background:#111;
      display:block;
    }
    #channelMeta{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:6px;
      flex:1;
    }
    #channelName{
      font-size:22px;
      font-weight:700;
      color:var(--accent);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    #epgBox{
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:15px;
      max-width:85vw;
      height:20px;
    }
    .epgTime{color:#d7d7d7; font-weight:700;}
    .epgTitle{color:#fff; font-weight:600;}
    .epgDesc{color:#c7c7c7; opacity:.85;}
    
    #controls{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
    }
    .ctrl{
      width:52px;
      height:52px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      color:#fff;
      font-size:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
      outline:none;
    }
    .ctrl:focus{
      background:#fff;
      color:#000;
      border:2px solid var(--accent);
      transform:scale(1.08);
      box-shadow:0 0 0 3px rgba(255,152,0,.2);
    }
    
    .modal{
      position:absolute;
      left:50%;
      bottom:125px;
      transform:translateX(-50%);
      width:min(520px, calc(100vw - 40px));
      background:rgba(12,12,12,.65);
      border:1px solid rgba(255,255,255,.15);
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:18px;
      display:none;
      z-index:25;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      pointer-events:auto;
    }
    .modal.show{display:block}
    
    .modalHeader {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
      position:relative;
    }
    .modalTitle{
      color:var(--accent);
      font-size:22px;
      font-weight:700;
      margin:0;
    }
    
    .close-modal-btn {
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.15);
      color:#fff;
      width:32px;
      height:32px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      cursor:pointer;
      outline:none;
      transition:background .2s, color .2s;
    }
    .close-modal-btn:focus, .close-modal-btn:hover {
      background:#fff;
      color:#000;
    }

    .modalList{
      display:flex;
      flex-direction:column;
      gap:10px;
      max-height:300px;
      overflow-y:auto;
      padding-right:4px;
    }
    
    .modalList::-webkit-scrollbar {
      width:6px;
    }
    .modalList::-webkit-scrollbar-thumb {
      background:rgba(255,255,255,.2);
      border-radius:4px;
    }
    
    .option{
      width:100%;
      height:50px;
      flex:0 0 50px;
      text-align:left;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.1);
      color:#fff;
      border-radius:14px;
      padding:0 18px;
      font-size:16px;
      outline:none;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      display:flex;
      align-items:center;
    }
    .option:focus{
      background:#fff;
      color:#000;
      border-color:var(--accent);
    }
    .option.selected{
      border-color:rgba(255,152,0,.7);
      box-shadow:inset 0 0 0 1px rgba(255,152,0,.35);
      background:rgba(255,152,0,.15);
    }

    #exitModal {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:min(420px, calc(100vw - 40px));
      background:rgba(15, 15, 15, 0.75);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:24px;
      padding:24px;
      display:none;
      z-index:40;
      backdrop-filter:blur(15px);
      -webkit-backdrop-filter:blur(15px);
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,0.8);
      pointer-events:auto;
    }
    #exitModal.show { display:block; }
    .exitTitle {
      font-size:20px;
      font-weight:600;
      margin-bottom:22px;
      color:#fff;
    }
    .exitButtons {
      display:flex;
      gap:14px;
      justify-content:center;
    }
    .exitBtn {
      min-width:110px;
      height:46px;
      border-radius:12px;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      outline:none;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(255,255,255,0.08);
      color:#fff;
      transition:background 0.2s, color 0.2s, transform 0.1s;
    }
    .exitBtn:focus {
      background:#fff;
      color:#000;
      border-color:var(--accent);
      transform:scale(1.04);
    }
    .exitBtn#exitNo {
      border-color:var(--accent);
      background:rgba(255,152,0,0.1);
    }

    .statusToast{
      position:absolute;
      top:70px;
      left:50%;
      transform:translateX(-50%);
      z-index:26;
      background:rgba(0,0,0,.8);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      border-radius:999px;
      padding:10px 18px;
      font-size:14px;
      opacity:0;
      transition:opacity .2s ease, transform .2s ease;
      pointer-events:none;
    }
    .statusToast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- Afegit poster inicial per defecte al 100% -->
  <video id="video" playsinline webkit-playsinline poster="https://xarxa-1.github.io/Xarxa-1/negre.jpg"></video>

  <div id="clock">--:--</div>

  <div id="splash">
    <img id="splashLogo" src="https://xarxa-1.github.io/Xarxa-1/logoiptv.jpeg" alt="Logo" />
    <div id="splashStatus">Carregant llistes...</div>
    <!-- Transformat d'un div a un botó interactiu real -->
    <button id="splashHint" tabindex="0">Prem OK per començar</button>
  </div>

  <div id="toast" class="statusToast"></div>

  <div id="audioModal" class="modal" aria-hidden="true">
    <div class="modalHeader">
      <div class="modalTitle">Àudio</div>
      <button class="close-modal-btn" onclick="closeAllModals()">✕</button>
    </div>
    <div id="audioList" class="modalList" tabindex="0"></div>
  </div>

  <div id="subtitleModal" class="modal" aria-hidden="true">
    <div class="modalHeader">
      <div class="modalTitle">Subtítols</div>
      <button class="close-modal-btn" onclick="closeAllModals()">✕</button>
    </div>
    <div id="subtitleList" class="modalList" tabindex="0"></div>
  </div>

  <div id="groupModal" class="modal" aria-hidden="true">
    <div class="modalHeader">
      <div class="modalTitle">Grups</div>
      <button class="close-modal-btn" onclick="closeAllModals()">✕</button>
    </div>
    <div id="groupList" class="modalList" tabindex="0"></div>
  </div>

  <div id="exitModal" aria-hidden="true">
    <div class="exitTitle">Segur que vols sortir de l'IPTV?</div>
    <div class="exitButtons">
      <button id="exitYes" class="exitBtn">Sí</button>
      <button id="exitNo" class="exitBtn">No</button>
    </div>
  </div>

  <div id="overlay">
    <div id="bottomBar">
      <div id="leftInfo">
        <button class="logo-btn" id="logoButton" tabindex="0">
          <img id="channelLogo" src="https://xarxa-1.github.io/Xarxa-1/negre.jpg" alt="Canal" />
        </button>
        <div id="channelMeta">
          <div id="channelName">Sense canal</div>
          <div id="epgBox"></div>
        </div>
      </div>
      <div id="controls">
        <button class="ctrl" data-action="volDown" tabindex="0">➖</button>
        <button class="ctrl" data-action="volUp" tabindex="0">➕</button>
        <button class="ctrl" data-action="audio" tabindex="0">🔊</button>
        <button class="ctrl" data-action="subtitles" tabindex="0">💬</button>
        <button class="ctrl" data-action="groups" tabindex="0">☰</button>
      </div>
    </div>
  </div>

<script>
const M3U_URL = "https://xarxa-1.github.io/Xarxa-1/cat325.m3u";
const EPG_URL = "https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/EPG_dobleM.xml";
const DEFAULT_LOGO = "https://xarxa-1.github.io/Xarxa-1/negre.jpg";
const BG_NEGRE = "https://xarxa-1.github.io/Xarxa-1/negre.jpg";

const video = document.getElementById('video');
const splash = document.getElementById('splash');
const splashHint = document.getElementById('splashHint');
const splashStatus = document.getElementById('splashStatus');
const clock = document.getElementById('clock');
const overlay = document.getElementById('overlay');
const toast = document.getElementById('toast');
const channelLogo = document.getElementById('channelLogo');
const channelName = document.getElementById('channelName');
const epgBox = document.getElementById('epgBox');
const audioModal = document.getElementById('audioModal');
const subtitleModal = document.getElementById('subtitleModal');
const groupModal = document.getElementById('groupModal');
const exitModal = document.getElementById('exitModal');
const audioList = document.getElementById('audioList');
const subtitleList = document.getElementById('subtitleList');
const groupList = document.getElementById('groupList');
const exitYes = document.getElementById('exitYes');
const exitNo = document.getElementById('exitNo');

const logoButton = document.getElementById('logoButton');
const controls = [logoButton, ...document.querySelectorAll('.ctrl')];

let channels = [];
let groups = [];
let epgMap = new Map();
let currentGroup = 'ALL';
let filteredChannels = [];
let currentIndex = 0;
let pendingIndex = null;
let currentHls = null;
let uiVisible = true;
let hideTimer = null;
let ready = false;
let lastBackPressTime = 0;

function updateClock(){
  const d = new Date();
  clock.textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateClock, 1000); updateClock();

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(()=>toast.classList.remove('show'), 1200);
}

function showUI(){
  overlay.classList.remove('hidden');
  uiVisible = true;
  resetHideTimer();
}
function hideUI(){
  if(anyModalOpen() || exitModal.classList.contains('show')) return; 
  overlay.classList.add('hidden');
  uiVisible = false;
}
function resetHideTimer(){
  clearTimeout(hideTimer);
  if(!anyModalOpen() && !exitModal.classList.contains('show')) {
    hideTimer = setTimeout(()=>hideUI(), 6000);
  }
}

function sanitizeText(str){
  return (str || '')
    .replace(/<[^>]*>/g,' ')       
    .replace(/\[[^\]]*\]/g,' ')    
    .replace(/&[^;]+;/g,' ')       
    .replace(/\s+/g,' ')           
    .trim();
}

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const out = [];
  let meta = null;
  for(const line of lines){
    if(line.startsWith('#EXTINF:')){
      const attrs = {};
      const attrsRegex = /([\w-]+)="([^"]*)"/g;
      let m;
      while((m = attrsRegex.exec(line))) attrs[m[1]] = m[2];
      const name = sanitizeText(line.split(',').slice(1).join(','));
      meta = {
        name,
        tvgId: attrs['tvg-id'] || '',
        tvgLogo: attrs['tvg-logo'] || '',
        groupTitle: attrs['group-title'] || 'Sense grup'
      };
    } else if(line && !line.startsWith('#') && meta){
      out.push({...meta, url: line.trim()});
      meta = null;
    }
  }
  return out;
}

function parseEPG(xmlText){
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'text/xml');
  const progs = [...doc.querySelectorAll('programme')];
  epgMap = new Map();
  for(const p of progs){
    const chan = p.getAttribute('channel') || '';
    const start = p.getAttribute('start') || '';
    const stop = p.getAttribute('stop') || '';
    const title = sanitizeText(p.querySelector('title')?.textContent);
    const desc = sanitizeText(p.querySelector('desc')?.textContent);
    const entry = {start, stop, title, desc};
    if(!epgMap.has(chan)) epgMap.set(chan, []);
    epgMap.get(chan).push(entry);
  }
  for(const [k,v] of epgMap) v.sort((a,b)=>a.start.localeCompare(b.start));
}

function normalizeDate(str){
  if(!str) return null;
  const m = str.match(/^(\d{14})(?:\s([+\-]\d{4}|Z))?/);
  if(!m) return null;
  const s = m[1];
  const tz = m[2] || 'Z';
  const iso = `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}${tz === 'Z' ? 'Z' : `${tz.slice(0,3)}:${tz.slice(3)}`}`;
  return new Date(iso);
}

function currentEpg(channel){
  const arr = epgMap.get(channel.tvgId) || epgMap.get(channel.name) || [];
  const now = new Date();
  return arr.find(p => {
    const s = normalizeDate(p.start);
    const e = normalizeDate(p.stop);
    return s && e && now >= s && now < e;
  }) || null;
}

function updateEpgUI(channel){
  const epg = currentEpg(channel);
  if(epg){
    const s = normalizeDate(epg.start);
    const e = normalizeDate(epg.stop);
    const fmt = d => d ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
    
    const timeStr = `${fmt(s)} - ${fmt(e)}`;
    const titleStr = epg.title || '';
    const descStr = epg.desc || '';

    if (timeStr || titleStr || descStr) {
      epgBox.innerHTML = `
        <span class="epgTime">${timeStr}</span> 
        ${titleStr ? `<span class="epgTitle"> - ${titleStr}</span>` : ''}
        ${descStr ? `<span class="epgDesc"> : ${descStr}</span>` : ''}
      `;
    } else {
      epgBox.innerHTML = '';
    }
  } else {
    epgBox.innerHTML = ''; 
  }
}

function setChannelInfo(channel){
  channelName.textContent = channel?.name || 'Sense canal';
  channelLogo.src = channel?.tvgLogo || DEFAULT_LOGO;
  updateEpgUI(channel || {});
}

function buildGroups(){
  const set = new Set(channels.map(c => c.groupTitle || 'Sense grup'));
  groups = ['ALL', ...[...set].sort()];
  groupList.innerHTML = '';
  groups.forEach(g => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = g === 'ALL' ? 'Tots els grups' : g;
    b.dataset.value = g;
    b.dataset.group = g;
    b.tabIndex = 0;
    b.addEventListener('click', ()=>selectGroup(g));
    groupList.appendChild(b);
  });
}

function refreshFiltered(){
  filteredChannels = currentGroup === 'ALL' ? [...channels] : channels.filter(c => c.groupTitle === currentGroup);
  if(filteredChannels.length === 0) filteredChannels = [...channels];
  currentIndex = Math.max(0, Math.min(currentIndex, filteredChannels.length - 1));
  renderGroupsSelected();
}

function renderGroupsSelected(){
  [...groupList.querySelectorAll('.option')].forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.value === currentGroup);
  });
}

function openModal(modal){
  closeAllModalsWithoutFocus();
  
  const options = modal.querySelectorAll('.modalList .option');
  if(options.length === 0 || (options.length === 1 && options[0].textContent.includes('Cap pista'))) {
    showToast('No hi ha opcions disponibles');
    logoButton.focus();
    return;
  }

  modal.classList.add('show');
  showUI();
  
  if (modal === groupModal) {
    const activeGroupBtn = groupList.querySelector(`[data-group="${currentGroup}"]`);
    if (activeGroupBtn) {
      activeGroupBtn.classList.add('selected');
      activeGroupBtn.focus();
      activeGroupBtn.scrollIntoView({ block: 'center' });
      return;
    }
  }

  const selectedOpt = modal.querySelector('.option.selected');
  if(selectedOpt) {
    selectedOpt.focus();
    selectedOpt.scrollIntoView({ block: 'center' });
  } else if(options[0]) {
    options[0].focus();
  }
}

function openExitModal() {
  closeAllModalsWithoutFocus();
  exitModal.classList.add('show');
  showUI();
  exitNo.focus();
}

function closeExitModal() {
  exitModal.classList.remove('show');
  logoButton.focus();
  resetHideTimer();
}

function closeAllModals(){
  let anyOpen = anyModalOpen() || exitModal.classList.contains('show');
  [audioModal, subtitleModal, groupModal, exitModal].forEach(m => m.classList.remove('show'));
  if(anyOpen) {
    logoButton.focus();
  }
  resetHideTimer();
}

function closeAllModalsWithoutFocus(){
  [audioModal, subtitleModal, groupModal, exitModal].forEach(m => m.classList.remove('show'));
}

function anyModalOpen(){
  return audioModal.classList.contains('show') || subtitleModal.classList.contains('show') || groupModal.classList.contains('show');
}

function playChannel(index, commit=false){
  if(!filteredChannels.length) return;
  currentIndex = (index + filteredChannels.length) % filteredChannels.length;
  const ch = filteredChannels[currentIndex];
  setChannelInfo(ch);
  if(commit) startPlayback(ch);
  showToast(`${commit ? 'Reproduint' : 'Zapping'}: ${ch.name}`);
}

function startPlayback(channel){
  pendingIndex = null;
  
  // Esborra la reproducció anterior i força que es mostri el fons negre
  video.pause();
  video.removeAttribute('src');
  video.load(); 
  
  if(currentHls){
    currentHls.destroy();
    currentHls = null;
  }
  
  const src = channel.url;
  if(window.Hls && Hls.isSupported() && /\.m3u8(\?|#|$)/i.test(src)){
    currentHls = new Hls();
    currentHls.attachMedia(video);
    currentHls.on(Hls.Events.MEDIA_ATTACHED, () => currentHls.loadSource(src));
    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
      refreshTrackMenus();
      video.play().catch(()=>{});
    });
    currentHls.on(Hls.Events.ERROR, (_, data) => {
      if(data.fatal) showToast('Error de streaming');
    });
  } else {
    video.src = src;
    video.play().catch(()=>{});
    setTimeout(refreshTrackMenus, 700);
  }
  
  if(!ready) {
    ready = true;
    splash.classList.add('hidden');
    setTimeout(()=>splash.remove(), 500);
  }
}

function refreshTrackMenus(){
  audioList.innerHTML = '';
  subtitleList.innerHTML = '';

  const audioTracks = currentHls?.audioTracks || [];
  if(audioTracks.length){
    audioTracks.forEach((t, i) => {
      const b = mkOption(`${t.name || t.lang || 'Àudio ' + (i+1)}`, ()=>selectAudio(i));
      if(currentHls.audioTrack === i) b.classList.add('selected');
      audioList.appendChild(b);
    });
  } else {
    audioList.appendChild(mkOption('Cap pista d’àudio detectada', ()=>{}));
  }

  const subTracks = currentHls?.subtitleTracks || [];
  if(subTracks.length){
    subtitleList.appendChild(mkOption('Desactivats', ()=>selectSubtitle(-1)));
    subTracks.forEach((t, i) => {
      const b = mkOption(`${t.name || t.lang || 'Subtítol ' + (i+1)}`, ()=>selectSubtitle(i));
      if(currentHls.subtitleTrack === i) b.classList.add('selected');
      subtitleList.appendChild(b);
    });
  } else {
    subtitleList.appendChild(mkOption('Cap subtítol detectat', ()=>{}));
  }
}

function mkOption(text, onClick){
  const b = document.createElement('button');
  b.className = 'option';
  b.textContent = text;
  b.tabIndex = 0;
  b.addEventListener('click', (e) => {
    onClick();
    closeAllModals(); 
  });
  return b;
}

function selectAudio(i){
  if(currentHls) currentHls.audioTrack = i;
  showToast('Àudio canviat');
}

function selectSubtitle(i){
  if(currentHls) currentHls.subtitleTrack = i;
  showToast(i < 0 ? 'Subtítols desactivats' : 'Subtítols canviats');
}

function selectGroup(g){
  currentGroup = g;
  refreshFiltered();
  buildGroups();
  showToast(g === 'ALL' ? 'Tots els grups' : g);
  closeAllModals(); 
  pendingIndex = null;
  currentIndex = 0;
  playChannel(0, true); 
}

function focusButtonByDelta(delta){
  const idx = controls.findIndex(b => b === document.activeElement);
  let next = idx < 0 ? 0 : (idx + delta + controls.length) % controls.length;
  controls[next].focus();
}

function commitFocused(){
  const active = document.activeElement;
  if(active && (active.classList.contains('ctrl') || active.classList.contains('option') || active.classList.contains('logo-btn') || active.classList.contains('close-modal-btn') || active.classList.contains('exitBtn') || active.id === 'splashHint')) {
    active.click();
  } else if(pendingIndex !== null) {
    startPlayback(filteredChannels[pendingIndex]);
  } else if(filteredChannels.length) {
    startPlayback(filteredChannels[currentIndex]);
  }
}

logoButton.addEventListener('click', () => {
  showUI();
  const targetIndex = pendingIndex !== null ? pendingIndex : currentIndex;
  playChannel(targetIndex, true);
});

// Acció clic del botó de benvinguda de la Splash Screen
splashHint.addEventListener('click', (e) => {
  e.stopPropagation();
  if(filteredChannels.length) {
    startPlayback(filteredChannels[currentIndex]);
  }
});

document.querySelectorAll('.ctrl').forEach(btn => {
  btn.addEventListener('click', (e) => {
    showUI();
    const a = btn.dataset.action;
    if(a === 'volDown') {
      video.volume = Math.max(0, +(video.volume - 0.1).toFixed(1));
      showToast(`Volum ${Math.round(video.volume*100)}%`);
    }
    if(a === 'volUp') {
      video.volume = Math.min(1, +(video.volume + 0.1).toFixed(1));
      showToast(`Volum ${Math.round(video.volume*100)}%`);
    }
    if(a === 'audio') {
      refreshTrackMenus();
      openModal(audioModal);
    }
    if(a === 'subtitles') {
      refreshTrackMenus();
      openModal(subtitleModal);
    }
    if(a === 'groups') openModal(groupModal);
  });
});

exitYes.addEventListener('click', () => {
  showToast("Sortint...");
  setTimeout(() => {
    window.location.href = "about:blank";
  }, 400);
});

exitNo.addEventListener('click', () => {
  closeExitModal();
});

document.addEventListener('click', () => showUI());
document.addEventListener('mousemove', () => showUI());
document.addEventListener('keydown', (e) => {
  showUI();
  const code = e.keyCode || e.which;
  
  if(code === 27 || code === 8 || code === 461 || code === 10009){ 
    e.preventDefault();
    if(exitModal.classList.contains('show')) {
      closeExitModal();
      return;
    }
    if(anyModalOpen()){
      closeAllModals(); 
      return;
    }
    const now = Date.now();
    if(now - lastBackPressTime < 1500) {
      openExitModal();
    } else {
      showToast("Torna a prémer 'Enrere' per sortir");
    }
    lastBackPressTime = now;
    return;
  }

  if(code === 13){
    e.preventDefault();
    commitFocused();
    return;
  }

  if(exitModal.classList.contains('show')) {
    if(code === 37) { 
      e.preventDefault();
      exitYes.focus();
    }
    if(code === 39) { 
      e.preventDefault();
      exitNo.focus();
    }
    return;
  }

  if(code === 38){
    e.preventDefault();
    if(anyModalOpen()){
      const modal = document.querySelector('.modal.show .modalList');
      const buttons = [...modal.querySelectorAll('.option')];
      const idx = buttons.indexOf(document.activeElement);
      const nextBtn = buttons[(idx <= 0 ? buttons.length : idx) - 1];
      if(nextBtn) {
        nextBtn.focus();
        nextBtn.scrollIntoView({ block: 'nearest' });
      }
    } else {
      pendingIndex = (pendingIndex === null ? currentIndex : pendingIndex);
      pendingIndex = (pendingIndex - 1 + filteredChannels.length) % filteredChannels.length;
      playChannel(pendingIndex, false);
    }
    return;
  }
  if(code === 40){
    e.preventDefault();
    if(anyModalOpen()){
      const modal = document.querySelector('.modal.show .modalList');
      const buttons = [...modal.querySelectorAll('.option')];
      const idx = buttons.indexOf(document.activeElement);
      const nextBtn = buttons[(idx + 1) % buttons.length];
      if(nextBtn) {
        nextBtn.focus();
        nextBtn.scrollIntoView({ block: 'nearest' });
      }
    } else {
      pendingIndex = (pendingIndex === null ? currentIndex : pendingIndex);
      pendingIndex = (pendingIndex + 1) % filteredChannels.length;
      playChannel(pendingIndex, false);
    }
    return;
  }
  if(code === 37){
    e.preventDefault();
    if(!anyModalOpen()){
      focusButtonByDelta(-1);
    }
    return;
  }
  if(code === 39){
    e.preventDefault();
    if(!anyModalOpen()){
      focusButtonByDelta(1);
    }
    return;
  }
  if(code === 415 || code === 175){
    video.volume = Math.min(1, +(video.volume + 0.1).toFixed(1));
    showToast(`Volum ${Math.round(video.volume*100)}%`);
    return;
  }
  if(code === 174){
    video.volume = Math.max(0, +(video.volume - 0.1).toFixed(1));
    showToast(`Volum ${Math.round(video.volume*100)}%`);
    return;
  }
});

async function boot(){
  try{
    splashStatus.textContent = 'Carregant llistes...';
    const [m3uRes, epgRes] = await Promise.all([fetch(M3U_URL), fetch(EPG_URL)]);
    const [m3uText, epgText] = await Promise.all([m3uRes.text(), epgRes.text()]);
    channels = parseM3U(m3uText);
    parseEPG(epgText);
    buildGroups();
    refreshFiltered();
    setChannelInfo(filteredChannels[0] || {});
    splashStatus.textContent = 'Llistes carregades';
    splashHint.classList.add('show');
    splashHint.focus(); // Enfoca automàticament el nou botó d'inici
  } catch(err){
    splashStatus.textContent = 'Error carregant les llistes';
    splashHint.textContent = 'Prem per reintentar';
    splashHint.classList.add('show');
    showToast('Error de càrrega');
    console.error(err);
  }
}

boot();
resetHideTimer();
setInterval(()=>{
  if(filteredChannels[currentIndex]) updateEpgUI(filteredChannels[currentIndex]);
}, 30000);
</script>
