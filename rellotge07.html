<!DOCTYPE html>

<html lang="ca"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smartwatch Interface</title>
<!-- Load Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Tactical look -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-typography">
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Antonio', sans-serif;
      overflow: hidden;
    }
    * {
      font-family: 'Antonio', sans-serif !important;
    }
    .font-tactical {
      font-weight: 600;
    }
    .text-accent-yellow { color: #facc15; }
    .text-accent-green { color: #4ade80; }
  </style>
<style data-purpose="circular-layout">
    /* Main Watch Container - Now borderless and full-width/height */
    .watch-face {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: #000;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Central Panel - Solid black background and high z-index to hide needle */
    .central-column {
      width: 80px;
      height: 100%;
      background: #000;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px 0;
    }

    /* Battery Ruler Gauge - Integrated */
    .battery-ruler {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 380px;
      background: transparent;
      z-index: 5;
      display: flex;
      align-items: center;
    }

    .ruler-numbers {
      position: absolute;
      right: 10px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 1.5rem;
      font-weight: 500;
      color: #fff;
      z-index: 6;
      pointer-events: none;
    }

    /* Needle is now a horizontal line matching number width */
    .battery-pointer {
      position: absolute;
      right: 10px;
      width: 45px;
      height: 2px;
      background: #ef4444;
      z-index: 10;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
      pointer-events: none;
      transition: top 0.5s ease-out;
    }

    /* Weather Panel Left */
    .left-panel {
      position: absolute;
      left: 20px;
      width: 120px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 15;
    }
  </style>
</head>
<body class="flex min-h-screen">
<!-- BEGIN: Smartwatch UI -->
<div class="watch-face" data-purpose="watch-container">
<!-- BEGIN: Left Weather Panel -->
<div class="left-panel text-[0.95rem]" data-purpose="weather-data">
<div class="flex items-center gap-2">
<span class="text-accent-green text-lg">Temperatura</span>
</div>
<div class="flex items-center gap-2">
<span class="text-white text-2xl text-xl" id="curr-temp">--°C</span>
</div>
<div class="flex flex-col">
<span class="text-gray-500 capitalize text-sm">Sensació</span>
<span class="text-accent-yellow text-xl" id="app-temp">--°C</span>
</div>
<div class="flex flex-col">
<span class="text-gray-500 capitalize text-sm">Vent</span>
<span class="text-accent-green text-xl" id="wind-speed">-- Km/h</span>
</div>
<div class="flex flex-col">
<span class="text-gray-500 capitalize text-sm">Pluja 3h</span>
<span class="text-white text-xl" id="rain-3h">0.0 mm</span>
</div>
<div class="flex flex-col">
<span class="text-gray-500 capitalize text-sm">Lluna</span>
<span class="text-white text-xl" id="moon-phase">--</span>
</div>
<div class="mt-2 pt-4 border-t border-gray-800">
<div class="flex items-center gap-2 text-xl">
<span class="text-orange-400">☀</span>
<span id="sunrise">--:--</span>
</div>
<div class="flex items-center gap-2 text-xl mt-1">
<span class="text-indigo-400">☾</span>
<span id="sunset">--:--</span>
</div>
</div>
</div>
<!-- END: Left Weather Panel -->
<!-- BEGIN: Center Clock Panel -->
<div class="central-column" data-purpose="clock-face">
<div class="flex flex-col items-center">
<div class="text-8xl font-tactical tracking-tighter leading-none" id="clock-hours">00</div>
<div class="text-8xl font-tactical tracking-tighter text-accent-yellow leading-none" id="clock-minutes">00</div>
</div>
<div class="flex flex-col items-center gap-1 mt-6">
<div class="px-3 py-1 border border-gray-700 rounded bg-black flex gap-2">
<span class="text-accent-green text-xl" id="clock-seconds">00</span>
<span class="text-gray-500 self-center text-sm">SEG</span>
</div>
<div class="flex gap-3 mt-2 text-sm">
<span class="px-2 bg-gray-900 rounded opacity-30" id="period-am">AM</span>
<span class="px-2 bg-gray-900 rounded opacity-30" id="period-pm">PM</span>
</div>
</div>
<div class="mt-6 text-center">
<div class="font-bold text-accent-yellow capitalize tracking-[0.2em] text-lg" id="calendar-date">
          DIUMENGE 28
        </div><div class="font-bold text-accent-yellow capitalize tracking-[0.2em] mt-1 text-lg" id="calendar-year">2024</div>
</div>
<div class="mt-6 text-xs opacity-50" id="charge-status">
<svg class="h-8 w-8" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13 10V3L4 14h7v7l9-11h-7z" id="charge-icon-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div><div class="text-lg font-bold opacity-80 mt-2" id="battery-percent-text">--%</div>
</div>
<!-- END: Center Clock Panel -->
<!-- BEGIN: Right Battery Gauge -->
<div class="battery-ruler" data-purpose="battery-display">
<div class="ruler-marks"></div>
<div class="ruler-numbers text-base">
<span>100</span>
<span>75</span>
<span>50</span>
<span>25</span>
<span>0</span>
</div>
</div>
<!-- END: Right Battery Gauge -->
<div class="battery-pointer" id="battery-needle" style="position: absolute; right: 10px; width: 45px; height: 2px; background: #ef4444; z-index: 60; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); pointer-events: none; transition: top 0.5s ease-out;"></div></div>
<!-- END: Smartwatch UI -->
<script data-purpose="clock-logic">
    /**
     * Updates the digital clock and calendar in Catalan
     */
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const isPm = now.getHours() >= 12;

      document.getElementById('clock-hours').textContent = hours;
      document.getElementById('clock-minutes').textContent = minutes;
      document.getElementById('clock-seconds').textContent = seconds;

      document.getElementById('period-am').style.opacity = isPm ? "0.3" : "1";
      document.getElementById('period-pm').style.opacity = isPm ? "1" : "0.3";

      const options = { weekday: 'long', day: 'numeric' };
      let dateString = now.toLocaleDateString('ca-ES', options).toUpperCase();
      document.getElementById('calendar-date').textContent = dateString;

      // Update year
      document.getElementById('calendar-year').textContent = now.getFullYear();
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
<script data-purpose="weather-api">
    function getMoonPhase(year, month, day) {
      let c = e = jd = b = 0;
      if (month < 3) {
        year--;
        month += 12;
      }
      ++month;
      c = 365.25 * year;
      e = 30.6 * month;
      jd = c + e + day - 694039.09;
      jd /= 29.5305882;
      b = parseInt(jd);
      jd -= b;
      b = Math.round(jd * 8);
      if (b >= 8) b = 0;
      const phases = ["Nova", "Creixent", "Quart Creixent", "Gibuosa Creixent", "Plena", "Gibuosa Minvant", "Quart Minvant", "Minvant"];
      return phases[b];
    }

    async function fetchWeather() {
      let lat = 41.3851, lon = 2.1734; // Default Barcelona

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition((position) => {
          lat = position.coords.latitude;
          lon = position.coords.longitude;
          updateWeatherUI(lat, lon);
        }, () => updateWeatherUI(lat, lon));
      } else {
        updateWeatherUI(lat, lon);
      }
    }

    async function updateWeatherUI(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=precipitation&daily=temperature_2m_max,apparent_temperature_max,sunrise,sunset&forecast_days=1&timezone=auto`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        document.getElementById('curr-temp').textContent = `${Math.round(data.current_weather.temperature)}°C`;
        document.getElementById('app-temp').textContent = `${Math.round(data.daily.apparent_temperature_max[0])}°C`;
        document.getElementById('wind-speed').textContent = `${data.current_weather.windspeed} Km/h`;

        // Calculate rain in next 3 hours
        const hourlyPrecip = data.hourly.precipitation.slice(0, 3);
        const rainSum = hourlyPrecip.reduce((a, b) => a + b, 0);
        document.getElementById('rain-3h').textContent = `${rainSum.toFixed(1)} mm`;

        const now = new Date();
        document.getElementById('moon-phase').textContent = getMoonPhase(now.getFullYear(), now.getMonth() + 1, now.getDate());

        const formatTime = (iso) => iso.split('T')[1];
        document.getElementById('sunrise').textContent = formatTime(data.daily.sunrise[0]);
        document.getElementById('sunset').textContent = formatTime(data.daily.sunset[0]);

      } catch (error) {
        console.error("Error fetching weather:", error);
      }
    }

    fetchWeather();
    setInterval(fetchWeather, 600000);
  </script>
<script data-purpose="battery-api">async function updateBattery() {
      const needle = document.getElementById('battery-needle');
      const ruler = document.querySelector('.battery-ruler');

      const setStatus = (level) => {
        const percent = Math.round(level * 100);
        const percentText = document.getElementById('battery-percent-text');
        if (percentText) percentText.textContent = `${percent}%`;

        // Vertical movement logic
        // The ruler is 380px tall, centered. Top is 0%, bottom is 100% in terms of DOM positioning,
        // but our scale has 100 at top and 0 at bottom.
        const rulerHeight = 380;
        const offset = (1 - level) * rulerHeight;
        const startY = (window.innerHeight - rulerHeight) / 2;
        needle.style.top = `${startY + offset}px`;

        const chargeIcon = document.getElementById('charge-status');
        // Logic for charging icon omitted for brevity but should be kept in actual implementation
      };

      if ('getBattery' in navigator) {
        const battery = await navigator.getBattery();
        setStatus(battery.level);
        battery.addEventListener('levelchange', () => setStatus(battery.level));
      } else {
        setStatus(0.85); // Default test level
      }
    }
    updateBattery();</script>
</body></html>
