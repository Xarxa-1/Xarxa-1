<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <link href='https://fonts.googleapis.com/css?family=Antonio' rel='stylesheet'>
    <title>RÀDIO STREAM</title>
<style>
    /* ===== ESTIL GENERAL · TONS FOSCS + VORADA 3D HI-FI ===== */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #0b1a0b;
        font-family: 'Antonio','Segoe UI', 'Courier New', monospace;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 8px;
        margin: 0;
        width: 100%;
    }

    .hifi-rack {
        max-width: 720px;
        width: 100%;
        background: #1c2a1c;
        background: linear-gradient(145deg, #1e2b1e 0%, #0f180f 100%);
        border: 2px solid #3f5a3f;
        border-radius: 40px 40px 30px 30px;
        box-shadow:
            0 20px 30px rgba(0,0,0,0.8),
            inset 0 -6px 8px rgba(0,0,0,0.7),
            inset 0 6px 10px #5f7a5f,
            0 0 0 4px #2e412e;
        padding: 20px 16px 22px 16px;
        color: #b0ffb0;
        text-shadow: 0 0 5px #00cc00, 0 0 2px #aaffaa;
    }

    .stream-deck {
        display: flex;
        flex-flow: row wrap;
        justify-content: center;
        align-items: center;
        gap: 10px 12px;
    }

    .module {
        background: #1f2c1f;
        border-radius: 20px;
        border: 2px solid #3d5a3d;
        box-shadow: inset 0 -3px 3px #0f130f, inset 0 3px 5px #6f8a6f, 0 5px 0 #0e170e;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 1 auto;
        backdrop-filter: blur(1px);
    }

    button {
        box-shadow: inset 0 0 12px black, 0 0 18px #44cc44;
        font-family: 'Antonio','Segoe UI', 'Courier New', monospace;
        background: #2b3c2b;
        border: none;
        border-radius: 40px;
        padding: 10px 16px;
        font-weight: bold;
        font-size: 2rem;
        color: #dbffdb;
        border-bottom: 5px solid #1b2a1b;
        border-right: 2px solid #4a6b4a;
        border-left: 2px solid #1c2b1c;
        box-shadow: 0 6px 0 #102010, 0 8px 12px black, inset 0 2px 10px #aaffaa;
        cursor: pointer;
        transition: all 0.08s linear;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
    }

    button:active {
        transform: none;
        border-bottom-width: 2px;
        box-shadow: 0 2px 0 #102010, 0 5px 10px black;
        background: #3c543c;
    }

    button.active {
        background: #4caf4c;
        border-bottom-color: #2d6b2d;
        box-shadow: 0 6px 0 #1e4d1e, 0 8px 12px black, inset 0 2px 10px #ffffaa;
        color: #ffffff;
    }

    button.active:active {
        background: #3d8e3d;
        border-bottom-width: 2px;
        box-shadow: 0 2px 0 #1e4d1e, 0 5px 10px black;
    }

    .station-logo {
        width: 80px;
        height: 80px;
        border-radius: 10%;
        object-fit: cover;
        border: 2px solid #77dd77;
        box-shadow: 0 0 0 1px #1a3a1a, 0 0 15px #00d000;
        background: #112211;
    }

    .status-led {
        width: 170px;
        display: flex;
        align-items: center;
        gap: 6px;
        background: #0e1f0e;
        border-radius: 40px;
        padding: 5px 16px 5px 12px;
        border: 1px solid #57aa57;
        box-shadow: inset 0 -3px 2px #091209;
    }

    .led-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #445544;
        box-shadow: 0 0 5px white;
        transition: background 0.15s, box-shadow 0.2s;
    }

    .led-dot.playing { background: #22ff22; box-shadow: 0 0 18px #44ff44; }
    .led-dot.buffering { background: #ffff44; box-shadow: 0 0 18px #ffffaa; animation: pulse 1s infinite; }
    .led-dot.stopped { background: #882222; box-shadow: 0 0 8px #ff2222; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } }

    .track-info {
        background: #1f2c1f;
        border-radius: 20px;
        border: 2px solid #3d5a3d;
        box-shadow: inset 0 -3px 3px #0f130f, inset 0 3px 5px #6f8a6f, 0 5px 0 #0e170e;
        padding: 8px 12px;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        max-width: 100%;
        min-width: 200px;
        flex: 1 1 auto;
        min-height: 70px;
        width: 100%;
    }

    .track-img {
        width: 70px;
        height: 70px;
        border-radius: 8px;
        background: #1e331e;
        border: 2px solid #9aff9a;
        object-fit: cover;
        flex-shrink: 0;
    }

    .track-text {
        font-size: 2rem;
        font-weight: 600;
        color: #ccffcc;
        text-shadow: 0 0 5px #11ee11;
        white-space: normal;
        overflow: hidden;
        text-overflow: ellipsis;
        word-wrap: break-word;
        word-break: break-word;
        line-height: 1.4;
        max-height: 5.6em;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        flex: 1;
    }

    .digital-clock {
        background: #142014;
        font-family: 'Antonio','Courier New', monospace;
        border-radius: 48px;
        padding: 10px 20px;
        border: 1px solid #2e352e;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 1px;
        color: #c8ffc8;
        line-height: 1;
    }

  .vol-control {
      display: flex;
      align-items: center;
      background: #1d2d1d;
      border-radius: 40px;
      padding: 2px 2px 2px 12px;
      border: 2px solid #5b965b;
      gap: 2px;
  }

  .vol-control span {
      font-size: 2rem;
      min-width: 55px;
      text-align: center;
      color: #9eff9e;
  }

  .vol-btn {
         padding: 8px 16px;
          font-size: 2rem;
        font-weight: 600;
      background: #2b3c2b;
      border-bottom: 4px solid #102210;
}
    .repeat-btn {
        padding: 6px 12px;
        font-size: 2rem;
        background: #2b3c2b;
        border-bottom: 4px solid #102210;
        min-width: 40px;
        border: none;
        border-radius: 40px;
        font-weight: bold;
        color: #dbffdb;
        border-bottom: 5px solid #1b2a1b;
        border-right: 2px solid #4a6b4a;
        border-left: 2px solid #1c2b1c;
        box-shadow: 0 6px 0 #102010, 0 8px 12px black, inset 0 2px 10px #aaffaa;
        cursor: pointer;
        transition: all 0.08s linear;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
    }

    .repeat-btn:active {
        transform: none;
        border-bottom-width: 2px;
        box-shadow: 0 2px 0 #102010, 0 5px 10px black;
        background: #3c543c;
    }

    .repeat-btn.active {
        background: #4caf4c;
        border-bottom-color: #2d6b2d;
        box-shadow: 0 6px 0 #1e4d1e, 0 8px 12px black, inset 0 2px 10px #ffffaa;
        color: #ffffff;
    }

    .repeat-btn.active:active {
        background: #3d8e3d;
        border-bottom-width: 2px;
        box-shadow: 0 2px 0 #1e4d1e, 0 5px 10px black;
    }

    /* Estils pel menú d'emissores - CENTRAT HORITZONTALMENT */
    .station-menu {
        width: 90%;
        position: relative;
        display: inline-block;
        z-index: 10000;
    }

    .station-btn {
        background: #2f482f;
        padding: 8px 14px;
        width: 270px;
        min-width: 90px;
        font-size: 2rem;
    }

    .station-dropdown {
        display: none;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 100%;
        margin-top: 8px;
        background: #203020;
        border: 3px solid #7fb27f;
        border-radius: 24px;
        padding: 8px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.9), 0 0 40px #22ff22;
        z-index: 999999;
        min-width: 220px;
        max-height: 320px;
        overflow-y: auto;
        flex-direction: column;
        gap: 6px;
        backdrop-filter: blur(10px);
    }

    .station-dropdown.show {
        display: flex;
    }

    .station-dropdown-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: #2b452b;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.1s ease;
        border-bottom: 2px solid #1b2f1b;
    }

    .station-dropdown-item:hover {
        background: #3d613d;
        transform: translateX(5px);
        border-bottom-color: #5f9e5f;
    }

    .station-dropdown-item.active {
        background: #4caf4c;
        border-bottom-color: #2d6b2d;
        box-shadow: inset 0 0 10px #aaffaa;
    }

    .station-dropdown-logo {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        object-fit: cover;
        border: 1px solid #77dd77;
        background: #112211;
    }

    .station-dropdown-name {
        font-size: 2rem;
        font-weight: 600;
        color: #ccffcc;
        flex: 1;
    }

    .station-dropdown-item.active .station-dropdown-name {
        color: #ffffff;
    }

    /* Estils pel menú del temporitzador */
    .timer-menu {
        position: relative;
        display: inline-block;
        z-index: 9000;
    }

    .timer-btn {
        background: #2f482f;
        padding: 8px 14px;
        width: auto;
        min-width: 90px;
        font-size: 1.4rem;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        margin-top: 8px;
        background: #203020;
        border: 3px solid #7fb27f;
        border-radius: 24px;
        padding: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.9), 0 0 40px #22ff22;
        z-index: 999999;
        min-width: 180px;
        flex-direction: column;
        gap: 10px;
        backdrop-filter: blur(10px);
    }

    .dropdown-content.show {
        display: flex;
    }

    .dropdown-content button {
        background: #2b452b;
        width: 100%;
        justify-content: center;
        font-size: 1.4rem;
        border-bottom: 4px solid #1b2f1b;
        padding: 8px 12px;
    }

    .dropdown-content button:active {
        transform: none;
        border-bottom-width: 1.4px;
        box-shadow: 0 2px 0 #102010, 0 5px 10px black;
    }

    .cancel-timer {
        background: #5d3a3a;
        border-bottom-color: #3d1f1f;
        color: #ffc0c0;
    }

    .timer-countdown {
        font-size: 1.4rem;
        text-align: center;
        background: #112211;
        border-radius: 30px;
        padding: 6px 8px;
        border: 2px solid #22cc22;
    }

    .clock-timer-container {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
    }

    /* Contenidor per al logo i els botons (sense el menú dins) */
    .station-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .station-controls {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    /* Estil per al text d'estat LED */
    #ledText {
        font-size: 2rem;
        min-width: 70px;
    }

    /* Media query per a pantalles molt petites */
    @media (max-width: 560px) {
        .hifi-rack {
            padding: 15px 10px;
        }

        .stream-deck {
            gap: 8px;
        }

        .station-logo, .track-img {
            width: 60px;
            height: 60px;
        }

        .digital-clock {
            font-size: 2rem;
            letter-spacing: 2px;
            padding: 6px 10px;
        }

        .vol-control span {
            min-width: 30px;
            font-size: 2rem;
        }

        .vol-btn {
            padding: 5px 10px;
            font-size: 2rem;
        }

        .track-info {
            min-width: 100%;
        }

        .dropdown-content,
        .station-dropdown {
            left: 50%;
            transform: translateX(-50%);
            min-width: 180px;
            right: auto;
        }

        .station-dropdown-logo {
            width: 32px;
            height: 32px;
        }

        button {
            font-size: 2rem;
            padding: 6px 12px;
        }

        .track-text {
            font-size: 2rem;
        }

        .station-btn {
            font-size: 2rem;
        }

        .timer-btn {
            font-size: 2rem;
        }

        .dropdown-content button {
            font-size: 2rem;
        }

        .timer-countdown {
            font-size: 2rem;
        }

        #ledText {
            font-size: 2rem;
        }
    }

    /* Personalitzar scroll del menú d'emissores */
    .station-dropdown::-webkit-scrollbar {
        width: 18px;
    }

    .station-dropdown::-webkit-scrollbar-track {
        background: #1a2a1a;
        border-radius: 10px;
    }

    .station-dropdown::-webkit-scrollbar-thumb {
        background: #5f9e5f;
        border-radius: 10px;
    }

    .station-dropdown::-webkit-scrollbar-thumb:hover {
        background: #7fbe7f;
    }
</style>
    <!-- Font Awesome per les icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="hifi-rack">
    <div class="stream-deck" id="streamDeck">

        <!-- selector d'emissores amb logo + menú desplegable (FORA DEL MODULE) -->
        <div class="module" style="padding: 4px;">
            <div class="station-info">
                <img id="stationLogoPreview" class="station-logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/Logotip_de_RAC_1.svg/1200px-Logotip_de_RAC_1.svg.png" alt="logo">
                <div class="station-controls">
                    <!-- Botons de navegació dins del module -->
                    <div style="display: flex; gap: 5px;">
                        <button id="prevStationBtn" title="Emissora anterior"><i class="fas fa-step-backward"></i></button>
                        <button id="playPauseBtn" title="Play / Pausa"><i class="fas fa-play"></i></button>
                        <button id="nextStationBtn" title="Emissora següent"><i class="fas fa-step-forward"></i></button>
                        <button class="repeat-btn" id="repeatBtn" title="Mode repetició: desactivat"><i class="fas fa-sync-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menú d'emissores - FORA DEL MODULE per evitar problemes de z-index -->
        <div class="station-menu">
            <button class="station-btn" id="stationMenuBtn"><i class="fas fa-radio"></i> Llista</button>
            <div class="station-dropdown" id="stationDropdown"></div>
        </div>

        <!-- volum amb dos botons + indicador -->
        <div style="display: flex; gap: 8px; align-items: center;">
            <div class="vol-control module">
                <span id="volDisplay">4/10</span>
                <button class="vol-btn" id="volDown">-</button>
                <button class="vol-btn" id="volUp">+</button>
            </div>
            <!-- indicador led estat -->
            <div class="status-led module" id="statusIndicator">
            <span id="ledDot" class="led-dot stopped"></span>
                <span id="ledText" style="min-width: 70px;">Aturat</span>
            </div>
        </div>

        <!-- contenidor per rellotge i temporitzador -->
        <div class="clock-timer-container">
            <!-- rellotge digital hh:mm:ss -->
            <div class="digital-clock module" id="liveClock">00:00:00</div>

            <!-- temporitzador: botó que desplega opcions -->
            <div class="timer-menu">
                <button class="timer-btn" id="timerMenuBtn"><i class="fas fa-clock"></i> 0:00</button>
                <div class="dropdown-content" id="timerDropdown">
                    <button data-minutes="0.1667"><i class="fas fa-hourglass-start"></i> 10 segons</button>
                    <button data-minutes="5"><i class="fas fa-hourglass-half"></i> 5 minuts</button>
                    <button data-minutes="30"><i class="fas fa-hourglass-half"></i> 30 minuts</button>
                    <button data-minutes="60"><i class="fas fa-hourglass-end"></i> 1 hora</button>
                    <button class="cancel-timer" id="cancelTimerBtn"><i class="fas fa-times"></i> Cancel·lar</button>
                    <div class="timer-countdown" id="countdownDisplay">00:00</div>
                </div>
            </div>
        </div>

        <!-- informació track: imatge + artista - títol -->
        <div class="track-info module" id="trackInfoModule">
            <img id="trackImage" class="track-img" src="https://via.placeholder.com/40x40/1a2a1a/88ff88?text=🎵" alt="cover">
            <div class="track-text" id="trackArtistTitle">Carregant...</div>
        </div>

    </div>
</div>

<script>
    (function() {
        const stationsUrl = 'https://xarxa-1.github.io/Xarxa-1/emissores.json';
        let stations = [];
        let currentIndex = 0;
        let audio = new Audio();
        audio.volume = 0.4;
        let isPlaying = false;
        let repeatMode = false;

        // Variables per la actualització periòdica de la info de la cançó
        let updateInterval = null;
        let currentStationPlaylistUrl = null;
        let currentStationLogo = null;

        const stationLogoPreview = document.getElementById('stationLogoPreview');
        const prevBtn = document.getElementById('prevStationBtn');
        const nextBtn = document.getElementById('nextStationBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volDisplay = document.getElementById('volDisplay');
        const volDown = document.getElementById('volDown');
        const volUp = document.getElementById('volUp');
        const repeatBtn = document.getElementById('repeatBtn');
        const ledDot = document.getElementById('ledDot');
        const ledText = document.getElementById('ledText');
        const trackImage = document.getElementById('trackImage');
        const trackArtistTitle = document.getElementById('trackArtistTitle');
        const timerMenuBtn = document.getElementById('timerMenuBtn');
        const timerDropdown = document.getElementById('timerDropdown');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const cancelTimerBtn = document.getElementById('cancelTimerBtn');
        const liveClock = document.getElementById('liveClock');
        const stationMenuBtn = document.getElementById('stationMenuBtn');
        const stationDropdown = document.getElementById('stationDropdown');

        let sleepTimerInterval = null;
        let sleepTimeout = null;
        let sleepEndTime = null;

        // Funció per aturar l'actualització periòdica
        function stopPeriodicUpdate() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        }

        // Funció per iniciar l'actualització periòdica (cada 5 segons)
        function startPeriodicUpdate(playlistUrl, stationLogo) {
            stopPeriodicUpdate();
            if (!playlistUrl) return;

            // Guardem la URL i logo actuals per comparar
            currentStationPlaylistUrl = playlistUrl;
            currentStationLogo = stationLogo;

            // Executem la primera actualització immediatament
            fetchAndUpdateTrackInfo(playlistUrl, stationLogo);

            // Configurem l'interval per actualitzar cada 5 segons
            updateInterval = setInterval(() => {
                // Verifiquem que encara estem a la mateixa emissora per evitar actualitzacions fora de lloc
                if (currentStationPlaylistUrl === playlistUrl && stations[currentIndex] && stations[currentIndex].playlist === playlistUrl) {
                    fetchAndUpdateTrackInfo(playlistUrl, stationLogo);
                }
            }, 5000);
        }

        function cleanImageUrl(url) {
            if (!url) return null;
            let cleaned = url.replace(/\\\//g, '/');
            cleaned = cleaned.replace(/:\//g, '://');
            cleaned = cleaned.replace(/\\/g, '');
            return cleaned;
        }

        function updateTrackImage(trackImageUrl, stationLogoUrl) {
            if (trackImageUrl && trackImageUrl !== '') {
                const cleanedUrl = cleanImageUrl(trackImageUrl);
                const img = new Image();
                img.onload = function() {
                    trackImage.src = cleanedUrl;
                };
                img.onerror = function() {
                    if (stationLogoUrl && stationLogoUrl !== '') {
                        trackImage.src = stationLogoUrl;
                    } else {
                        trackImage.src = 'https://via.placeholder.com/40x40/1a2a1a/88ff88?text=📻';
                    }
                };
                img.src = cleanedUrl;
            } else {
                if (stationLogoUrl && stationLogoUrl !== '') {
                    trackImage.src = stationLogoUrl;
                } else {
                    trackImage.src = 'https://via.placeholder.com/40x40/1a2a1a/88ff88?text=📻';
                }
            }
        }

        async function fetchAndUpdateTrackInfo(playlistUrl, stationLogo) {
            if (!playlistUrl) return;

            try {
                const resp = await fetch(playlistUrl);
                if (!resp.ok) throw new Error('Error en la petició');
                const data = await resp.json();
                if (data.success && data.result && data.result.length > 0) {
                    const first = data.result[0];
                    const artist = first.track_artist || '?';
                    const title = first.track_title || '?';
                    // Evitar mostrar "undefined - undefined" si no hi ha dades
                    if (artist !== '?' || title !== '?') {
                        trackArtistTitle.innerText = `${artist} - ${title}`;
                    } else {
                        trackArtistTitle.innerText = stations[currentIndex]?.name || 'Sense dades';
                    }
                    updateTrackImage(first.track_image, stationLogo);
                } else {
                    trackArtistTitle.innerText = stations[currentIndex]?.name || 'Sense dades';
                    if (stationLogo) {
                        trackImage.src = stationLogo;
                    }
                }
            } catch (e) {
                console.warn('Error carregant playlist:', e);
                trackArtistTitle.innerText = stations[currentIndex]?.name || 'Error playlist';
                if (stationLogo) {
                    trackImage.src = stationLogo;
                }
            }
        }

        function updateStationDropdown() {
            if (!stations.length) return;

            stationDropdown.innerHTML = '';
            stations.forEach((station, idx) => {
                const item = document.createElement('div');
                item.className = 'station-dropdown-item';
                if (idx === currentIndex) item.classList.add('active');

                const logo = document.createElement('img');
                logo.className = 'station-dropdown-logo';
                logo.src = station.logo || 'https://via.placeholder.com/40x40/1a2a1a/88ff88?text=📻';
                logo.alt = station.name;

                const name = document.createElement('span');
                name.className = 'station-dropdown-name';
                name.textContent = station.name;

                item.appendChild(logo);
                item.appendChild(name);

                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    loadStation(idx);
                    stationDropdown.classList.remove('show');
                    const shortName = station.name.length > 15 ? station.name.substring(0, 12) + '...' : station.name;
                    stationMenuBtn.innerHTML = `<i class="fas fa-radio"></i> ${shortName}`;
                });

                stationDropdown.appendChild(item);
            });
        }

        function updateClock() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2,'0');
            const mm = String(now.getMinutes()).padStart(2,'0');
            const ss = String(now.getSeconds()).padStart(2,'0');
            liveClock.innerText = `${hh}:${mm}:${ss}`;
        }
        setInterval(updateClock, 200);
        updateClock();

        function setLedState(state, text) {
            ledDot.className = 'led-dot';
            if (state === 'playing') ledDot.classList.add('playing');
            else if (state === 'buffering') ledDot.classList.add('buffering');
            else ledDot.classList.add('stopped');
            ledText.innerText = text;
        }

        function setVolume(vol) {
            vol = Math.min(1, Math.max(0, vol));
            audio.volume = vol;
            let display = Math.round(vol * 10);
            volDisplay.innerText = display + '/10';
        }

        function stopSleepTimer() {
            if (sleepTimeout) { clearTimeout(sleepTimeout); sleepTimeout = null; }
            if (sleepTimerInterval) { clearInterval(sleepTimerInterval); sleepTimerInterval = null; }
            sleepEndTime = null;
            countdownDisplay.innerText = '00:00';
            timerMenuBtn.innerHTML = '<i class="fas fa-clock"></i> 0:00';
        }

        function startSleepTimer(minutes) {
            stopSleepTimer();
            const ms = minutes * 60 * 1000;
            if (ms <= 0) return;
            sleepEndTime = Date.now() + ms;
            sleepTimerInterval = setInterval(() => {
                if (!sleepEndTime) { countdownDisplay.innerText = '00:00'; return; }
                const left = Math.max(0, sleepEndTime - Date.now());
                const totalSec = Math.floor(left / 1000);
                const mins = Math.floor(totalSec / 60);
                const secs = totalSec % 60;
                countdownDisplay.innerText = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                timerMenuBtn.innerHTML = `<i class="fas fa-clock"></i> ${mins}:${String(secs).padStart(2,'0')}`;
                if (left <= 0) {
                    audio.pause();
                    setLedState('stopped','Timer off');
                    isPlaying = false;
                    playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                    stopSleepTimer();
                }
            }, 200);
            sleepTimeout = setTimeout(() => {
                audio.pause();
                setLedState('stopped','Timer off');
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                stopSleepTimer();
            }, ms);
        }

        function loadStation(index) {
            if (!stations.length) return;

            const wasPlaying = isPlaying;

            currentIndex = Math.min(index, stations.length-1);
            const st = stations[currentIndex];

            if (st.logo) {
                stationLogoPreview.src = st.logo;
            }

            audio.pause();
            audio.src = '';

            setLedState('stopped', 'Aturat');
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';

            trackArtistTitle.innerText = st.name || 'Emissora';

            if (st.logo) {
                trackImage.src = st.logo;
            } else {
                trackImage.src = 'https://via.placeholder.com/40x40/1a2a1a/88ff88?text=📻';
            }

            updateStationDropdown();

            if (st.url) {
                audio.src = st.url;
                audio.load();

                // Iniciem l'actualització periòdica si hi ha playlist
                if (st.playlist) {
                    startPeriodicUpdate(st.playlist, st.logo);
                } else {
                    stopPeriodicUpdate();
                }

                if (wasPlaying) {
                    audio.play().catch(e => {
                        console.warn('Error reproduint després de carregar:', e);
                        setLedState('stopped','Error play');
                    });
                } else {
                    setLedState('stopped', 'Aturat');
                }
            } else {
                stopPeriodicUpdate();
                setLedState('stopped', 'Sense URL');
            }
        }

        function handleAudioEnded() {
            if (repeatMode) {
                console.log('Mode repetició actiu - repetint emissora actual');
                isPlaying = true;
                loadStation(currentIndex);
            } else {
                console.log('Passant a la següent emissora automàticament');
                let newIdx = currentIndex + 1;
                if (newIdx >= stations.length) newIdx = 0;
                isPlaying = true;
                loadStation(newIdx);
            }
        }

        audio.addEventListener('playing', () => {
            setLedState('playing','Sonant');
            isPlaying = true;
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
        });

        audio.addEventListener('waiting', () => {
            setLedState('buffering','Buffering');
        });

        audio.addEventListener('pause', () => {
            setLedState('stopped','Aturat');
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        });

        audio.addEventListener('ended', () => {
            console.log('Àudio finalitzat');
            setLedState('stopped','Aturat');
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            handleAudioEnded();
        });

        audio.addEventListener('error', (e) => {
            console.warn('Error d\'àudio:', e);
            setLedState('stopped','Error');
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        });

        playPauseBtn.addEventListener('click', () => {
            if (!stations.length || !stations[currentIndex]?.url) return;

            if (audio.paused) {
                audio.play().catch(e => {
                    console.warn('Error reproduint:', e);
                    setLedState('stopped','Error play');
                });
            } else {
                audio.pause();
            }
        });

        async function loadStations() {
            try {
                const resp = await fetch(stationsUrl);
                if (!resp.ok) throw new Error('Network error');
                stations = await resp.json();

                updateStationDropdown();

                if (stations.length > 0) {
                    loadStation(0);
                    const shortName = stations[0].name.length > 15 ? stations[0].name.substring(0, 12) + '...' : stations[0].name;
                    stationMenuBtn.innerHTML = `<i class="fas fa-radio"></i> ${shortName}`;
                }
            } catch (err) {
                console.warn('Error carregant emissores, fem servir dades estàtiques.');
                stations = [
                    { "name": "RAC1", "playlist": "https://api.instant.audio/data/playlist/38/rac1", "url": "https://20103.live.streamtheworld.com/RAC_1.mp3", "logo": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/Logotip_de_RAC_1.svg/1200px-Logotip_de_RAC_1.svg.png" },
                    { "name": "Flaixbac", "playlist": "https://api.instant.audio/data/playlist/38/flaixbac", "url": "https://stream.flaixbac.cat/icecast", "logo": "https://static.mytuner.mobi/media/radios-150px/274/flaixbac.f6d8cd83.jpg" },
                    { "name": "Catalunya Ràdio", "url": "https://directes-radio-int.ccma.cat/live-content/catalunyaradio-hls/bitrate_1.m3u8", "logo": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Catalunya_R%C3%A0dio_%28logo%29.svg/1200px-Catalunya_R%C3%A0dio_%28logo%29.svg.png" }
                ];
                updateStationDropdown();
                loadStation(0);
                const shortName = stations[0].name.length > 15 ? stations[0].name.substring(0, 12) + '...' : stations[0].name;
                stationMenuBtn.innerHTML = `<i class="fas fa-radio"></i> ${shortName}`;
            }
        }

        prevBtn.addEventListener('click', () => {
            if (stations.length === 0) return;
            let newIdx = currentIndex - 1;
            if (newIdx < 0) newIdx = stations.length-1;
            loadStation(newIdx);
            const shortName = stations[newIdx].name.length > 15 ? stations[newIdx].name.substring(0, 12) + '...' : stations[newIdx].name;
            stationMenuBtn.innerHTML = `<i class="fas fa-radio"></i> ${shortName}`;
        });

        nextBtn.addEventListener('click', () => {
            if (stations.length === 0) return;
            let newIdx = currentIndex + 1;
            if (newIdx >= stations.length) newIdx = 0;
            loadStation(newIdx);
            const shortName = stations[newIdx].name.length > 15 ? stations[newIdx].name.substring(0, 12) + '...' : stations[newIdx].name;
            stationMenuBtn.innerHTML = `<i class="fas fa-radio"></i> ${shortName}`;
        });

        repeatBtn.addEventListener('click', () => {
            repeatMode = !repeatMode;
            if (repeatMode) {
                repeatBtn.classList.add('active');
                repeatBtn.title = 'Mode repetició: actiu (es repeteix la mateixa emissora)';
            } else {
                repeatBtn.classList.remove('active');
                repeatBtn.title = 'Mode repetició: desactivat (passa a la següent emissora)';
            }
        });

        volUp.addEventListener('click', () => setVolume(audio.volume + 0.1));
        volDown.addEventListener('click', () => setVolume(audio.volume - 0.1));
        setVolume(0.4);

        // Menú del temporitzador
        timerMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            timerDropdown.classList.toggle('show');
        });

        // Menú d'emissores
        stationMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            stationDropdown.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!timerMenuBtn.contains(e.target) && !timerDropdown.contains(e.target)) {
                timerDropdown.classList.remove('show');
            }
            if (!stationMenuBtn.contains(e.target) && !stationDropdown.contains(e.target)) {
                stationDropdown.classList.remove('show');
            }
        });

        timerDropdown.querySelectorAll('button[data-minutes]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const min = parseFloat(btn.getAttribute('data-minutes'));
                startSleepTimer(min);
                timerDropdown.classList.remove('show');
            });
        });

        cancelTimerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            stopSleepTimer();
            timerDropdown.classList.remove('show');
        });

        loadStations();
    })();

</script>
</body>
</html>
