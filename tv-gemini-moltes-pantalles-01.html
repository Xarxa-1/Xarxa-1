<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiviewer HLS - Xarxa-1</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent: #007bff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .channel-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 2px solid transparent;
            transition: border 0.3s;
        }

        .channel-card:hover {
            border-color: var(--accent);
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            cursor: pointer;
            display: block;
        }

        .channel-info {
            position: absolute;
            top: 0;
            right: 0;
            padding: 4px 10px;
            font-size: 11px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            border-bottom-left-radius: 4px;
            z-index: 10;
            cursor: pointer;
            transition: background 0.2s;
            pointer-events: auto;
        }

        .channel-info:hover {
            background: var(--accent);
            text-decoration: underline;
        }

        footer {
            background: #111;
            padding: 15px;
            border-top: 1px solid #333;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .input-group, .pagination-group, .control-group, .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input, select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: white;
        }

        #m3u-url { width: 250px; }
        #search-input { width: 150px; }

        button {
            padding: 8px 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div id="grid-container"></div>

<footer>
    <div class="input-group">
        <input type="text" id="m3u-url" value="https://xarxa-1.github.io/Xarxa-1/cat19.m3u" placeholder="URL de la llista M3U">
        <button onclick="loadM3U()">Carregar</button>
    </div>

    <div class="filter-group">
        <input type="text" id="search-input" placeholder="Filtrar per nom..." oninput="handleFilterChange()">
    </div>

    <div class="pagination-group">
        <button id="prev-btn" onclick="changePage(-1)">« Anterior</button>
        <span id="page-info">Pàgina 1</span>
        <button id="next-btn" onclick="changePage(1)">Següent »</button>
    </div>

    <div class="filter-group">
        <select id="group-select" onchange="handleFilterChange()">
            <option value="all">Tots els grups</option>
        </select>
    </div>

    <div class="control-group">
        <label for="max-screens">Pantalles:</label>
        <input type="number" id="max-screens" value="12" min="1" style="width: 50px;">
        <span id="total-channels">Canals: 0</span>
    </div>
</footer>

<script>
    const container = document.getElementById('grid-container');
    const urlInput = document.getElementById('m3u-url');
    const maxInput = document.getElementById('max-screens');
    const totalLabel = document.getElementById('total-channels');
    const pageInfo = document.getElementById('page-info');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const searchInput = document.getElementById('search-input');
    const groupSelect = document.getElementById('group-select');

    let allChannels = [];
    let filteredChannels = [];
    let currentPage = 1;

    async function loadM3U() {
        const url = urlInput.value;
        container.innerHTML = 'Carregant canals...';
        currentPage = 1;

        try {
            const response = await fetch(url);
            const text = await response.text();
            allChannels = await textParse(text);
            
            // Omplir selector de grups
            updateGroupSelector();
            
            handleFilterChange();
        } catch (error) {
            container.innerHTML = 'Error en carregar la URL. Verifica el CORS o l\'adreça.';
            console.error(error);
        }
    }

    function updateGroupSelector() {
        const groups = [...new Set(allChannels.map(c => c.group))].sort();
        groupSelect.innerHTML = '<option value="all">Tots els grups</option>';
        groups.forEach(group => {
            if(group) {
                const opt = document.createElement('option');
                opt.value = group;
                opt.textContent = group;
                groupSelect.appendChild(opt);
            }
        });
    }

    function handleFilterChange() {
        const searchTerm = searchInput.value.toLowerCase();
        const selectedGroup = groupSelect.value;

        filteredChannels = allChannels.filter(channel => {
            const matchesSearch = channel.name.toLowerCase().includes(searchTerm);
            const matchesGroup = selectedGroup === 'all' || channel.group === selectedGroup;
            return matchesSearch && matchesGroup;
        });

        currentPage = 1;
        totalLabel.textContent = `Canals: ${filteredChannels.length}`;
        displayCurrentPage();
    }

    function displayCurrentPage() {
        const maxScreens = parseInt(maxInput.value);
        const startIndex = (currentPage - 1) * maxScreens;
        const endIndex = startIndex + maxScreens;
        const channelsToDisplay = filteredChannels.slice(startIndex, endIndex);

        renderChannels(channelsToDisplay);
        
        const totalPages = Math.ceil(filteredChannels.length / maxScreens) || 1;
        pageInfo.textContent = `Pàgina ${currentPage} de ${totalPages}`;
        
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage >= totalPages;
    }

    function changePage(step) {
        currentPage += step;
        displayCurrentPage();
        container.scrollTop = 0;
    }

    async function textParse(text) {
        const lines = text.split('\n');
        const channels = [];
        let currentName = "Canal desconegut";
        let currentGroup = "General";

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                // Extreure nom
                const nameParts = line.split(',');
                currentName = nameParts[nameParts.length - 1] || "Canal";
                
                // Extreure grup (group-title="...")
                const groupMatch = line.match(/group-title="([^"]+)"/);
                currentGroup = groupMatch ? groupMatch[1] : "General";
                
            } else if (line.startsWith('http')) {
                channels.push({ 
                    name: currentName, 
                    url: line, 
                    group: currentGroup 
                });
                currentName = "Canal desconegut";
                currentGroup = "General";
            }
        }
        return channels;
    }

    function openSinglePlayer(name, url) {
        const newWindow = window.open("", "_blank");
        const html = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>${name}</title>
                <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"><\/script>
                <style>
                    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
                    video { width: 100%; max-height: 100vh; }
                    .title-overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; }
                </style>
            </head>
            <body>
                <div class="title-overlay">${name}</div>
                <video id="video" controls autoplay></video>
                <script>
                    const video = document.getElementById('video');
                    const videoUrl = '${url}';
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(videoUrl);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = videoUrl;
                    }
                <\/script>
            </body>
            </html>
        `;
        newWindow.document.write(html);
        newWindow.document.close();
    }

    function renderChannels(channels) {
        container.innerHTML = '';
        if (channels.length === 0) {
            container.innerHTML = '<div style="padding:20px;">No s\'han trobat canals amb aquests criteris.</div>';
            return;
        }

        channels.forEach(channel => {
            const card = document.createElement('div');
            card.className = 'channel-card';

            const video = document.createElement('video');
            video.controls = true;
            video.preload = "metadata";
            video.muted = true;

            const info = document.createElement('div');
            info.className = 'channel-info';
            info.innerText = channel.name;
            info.title = `Grup: ${channel.group} - Clic per obrir sol`;
            
            info.addEventListener('click', (e) => {
                e.stopPropagation();
                openSinglePlayer(channel.name, channel.url);
            });

            card.appendChild(video);
            card.appendChild(info);
            container.appendChild(card);

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.pause();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
            }

            video.addEventListener('click', (e) => {
                if (video.paused) {
                    video.play();
                    video.parentElement.style.borderColor = "#28a745";
                } else {
                    video.pause();
                    video.parentElement.style.borderColor = "transparent";
                }
            });
        });
    }

    maxInput.addEventListener('change', () => {
        currentPage = 1;
        displayCurrentPage();
    });

    window.onload = loadM3U;
</script>
</body>
</html>
