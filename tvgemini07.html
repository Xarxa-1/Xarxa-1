<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor IPTV Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #007bff;
            --accent-hover: #0056b3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: var(--card-bg);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .sidebar h2 {
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 0.9rem;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .channel-list-container {
            flex-grow: 1;
            overflow-y: hidden;
            position: relative;
        }

        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .scroll-controls {
            display: flex;
            gap: 5px;
            margin-top: 10px;
            justify-content: center;
        }

        .channel-btn {
            background-color: #2a2a2a;
            border: 2px solid transparent;
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }

        .channel-btn:hover, .channel-btn.active {
            background-color: #333;
            border-color: var(--accent-color);
        }

        .channel-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .channel-name {
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Àrea principal */
        .main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #000;
            height: 100vh;
        }

        .player-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            overflow: hidden;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            max-height: 100%;
        }

        /* Controls Panel */
        .controls-panel {
            height: auto;
            min-height: 70px;
            padding: 10px 15px;
            background-color: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #333;
            gap: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
            z-index: 10;
        }

        /* Nou estil per a la info del canal actual al panell inferior */
        .current-info {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 120px; /* Amplada fixa */
            flex-shrink: 0;
            background: #2a2a2a;
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        .current-info img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 2px;
            background: #000;
        }

        .current-info span {
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70px; /* Limita visualment el text */
        }

        .nav-btn-small, .vol-btn, .fullscreen-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .nav-btn-small {
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 4px;
        }

        .vol-btn, .fullscreen-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.1rem;
        }

        .fullscreen-btn {
            background-color: #444;
            font-size: 1.3rem;
        }

        .nav-btn-small:hover, .vol-btn:hover, .fullscreen-btn:hover {
            background-color: var(--accent-color);
        }

        .search-input, #groupSelector {
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 4px;
            outline: none;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 35vh; }
            .channel-list-container { overflow-y: auto; }
            .scroll-controls { display: none; }
            .main { height: 65vh; }
            .current-info { width: auto; min-width: 100px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <div class="sidebar">
        <h2 id="currentGroupName">Tots els canals</h2>
        <div class="channel-list-container" id="scrollContainer">
            <div class="channel-list" id="channelList"></div>
        </div>
        <div class="scroll-controls">
            <button class="nav-btn-small" onclick="scrollList(-150)">▲</button>
            <button class="nav-btn-small" onclick="scrollList(150)">▼</button>
        </div>
    </div>

    <div class="main">
        <div class="player-container">
            <video id="videoPlayer" controls autoplay></video>
        </div>
        
        <div class="controls-panel">
            <div class="current-info" id="currentInfoDisplay">
                <img id="currentChannelLogo" src="https://xarxa-1.github.io/Xarxa-1/negre.jpg" alt="Logo">
                <span id="currentChannelName">---</span>
            </div>

            <select id="groupSelector" onchange="filterChannels()">
                <option value="all">Tots els grups</option>
            </select>
            
            <input type="text" id="channelSearch" class="search-input" placeholder="Cerca canal..." oninput="filterChannels()">
            
            <span style="border-left: 1px solid #444; height: 30px; margin: 0 5px;"></span>

            <button class="vol-btn" onclick="setVolume('mute')" title="Mut">🔇</button>
            <button class="vol-btn" onclick="setVolume('down')" title="Volum -">-</button>
            <button class="vol-btn" onclick="setVolume('up')" title="Volum +">+</button>

            <button class="fullscreen-btn" onclick="toggleFullScreen()" title="Pantalla Completa">⛶</button>

            <span style="border-left: 1px solid #444; height: 30px; margin: 0 5px;"></span>

            <button class="nav-btn-small" onclick="navigateChannel(-1)" title="Canal Anterior">&#9664;</button>
            <button class="nav-btn-small" onclick="navigateChannel(1)" title="Canal Següent">&#9654;</button>
        </div>
    </div>

    <script>
        const m3uUrl = 'https://xarxa-1.github.io/Xarxa-1/cat325.m3u';
        const defaultLogo = 'https://xarxa-1.github.io/Xarxa-1/negre.jpg';
        let allChannels = [];
        let filteredChannels = [];
        let currentIndex = 0;
        let hlsInstance = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                allChannels = await loadM3U(m3uUrl);
                populateGroups();
                filterChannels();
            } catch (error) {
                console.error('Error carregant M3U:', error);
            }
            window.addEventListener('keydown', handleKeyNavigation);
        });

        async function loadM3U(url) {
            const response = await fetch(url);
            const text = await response.text();
            const lines = text.split('\n');
            const parsedChannels = [];
            let currentChannel = null;

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    currentChannel.logo = (logoMatch && logoMatch[1]) ? logoMatch[1] : defaultLogo;
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    currentChannel.group = groupMatch ? groupMatch[1] : 'Sense Grup';
                    const commaIndex = line.lastIndexOf(',');
                    currentChannel.name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Canal sense nom';
                } else if (line.toLowerCase().includes('http')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        parsedChannels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
            return parsedChannels;
        }

        function populateGroups() {
            const selector = document.getElementById('groupSelector');
            const groups = [...new Set(allChannels.map(c => c.group))].sort();
            groups.forEach(group => {
                const option = document.createElement('option');
                option.value = group;
                option.innerText = group;
                selector.appendChild(option);
            });
        }

        function filterChannels() {
            const groupValue = document.getElementById('groupSelector').value;
            const searchValue = document.getElementById('channelSearch').value.toLowerCase();

            filteredChannels = allChannels.filter(channel => {
                const matchesGroup = (groupValue === 'all' || channel.group === groupValue);
                const matchesSearch = channel.name.toLowerCase().includes(searchValue);
                return matchesGroup && matchesSearch;
            });

            document.getElementById('currentGroupName').innerText = 
                groupValue === 'all' ? "Tots els canals" : groupValue;

            renderChannels();
        }

        function renderChannels() {
            const channelList = document.getElementById('channelList');
            channelList.innerHTML = '';
            
            filteredChannels.forEach((channel, index) => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                if (index === currentIndex) btn.classList.add('active');
                btn.onclick = () => playChannel(index);

                const img = document.createElement('img');
                img.className = 'channel-logo';
                img.src = channel.logo || defaultLogo;
                img.onerror = () => { img.src = defaultLogo; };

                const span = document.createElement('span');
                span.className = 'channel-name';
                span.innerText = (channel.url.startsWith('http://') ? '⚠️ ' : '') + channel.name;

                btn.appendChild(img);
                btn.appendChild(span);
                channelList.appendChild(btn);
            });
        }

        function playChannel(index) {
            if (index < 0 || index >= filteredChannels.length) return;
            currentIndex = index;

            const channel = filteredChannels[currentIndex];
            
            // Actualitzar el panell de control inferior (Logo i Nom max 8 caràcters)
            const displayLogo = document.getElementById('currentChannelLogo');
            const displayName = document.getElementById('currentChannelName');
            displayLogo.src = channel.logo || defaultLogo;
            displayLogo.onerror = () => { displayLogo.src = defaultLogo; };
            displayName.innerText = channel.name.substring(0, 8); // Truncar a 8 caràcters

            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', i === currentIndex);
                if(i === currentIndex) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            const video = document.getElementById('videoPlayer');
            if (hlsInstance) hlsInstance.destroy();

            if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => {}));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.play().catch(e => {});
            }
        }

        function scrollList(distance) {
            const container = document.getElementById('scrollContainer');
            container.scrollBy({ top: distance, behavior: 'smooth' });
        }

        function setVolume(action) {
            const video = document.getElementById('videoPlayer');
            if (action === 'mute') {
                video.muted = !video.muted;
            } else if (action === 'up') {
                video.volume = Math.min(1, video.volume + 0.1);
                video.muted = false;
            } else if (action === 'down') {
                video.volume = Math.max(0, video.volume - 0.1);
            }
        }

        function toggleFullScreen() {
            const video = document.getElementById('videoPlayer');
            if (!document.fullscreenElement) {
                if (video.requestFullscreen) video.requestFullscreen();
                else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
                else if (video.msRequestFullscreen) video.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function navigateChannel(direction) {
            if (filteredChannels.length === 0) return;
            let nextIndex = (currentIndex + direction + filteredChannels.length) % filteredChannels.length;
            playChannel(nextIndex);
        }

        function handleKeyNavigation(e) {
            if (document.activeElement.id === 'channelSearch') return;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                navigateChannel(e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? -1 : 1);
            }
            if (e.key === 'f' || e.key === 'F') toggleFullScreen();
        }
    </script>
</body>
</html>
