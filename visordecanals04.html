<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de canals M3U</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  header { padding: 16px; background: #1d1d1d; position: sticky; top: 0; z-index: 10;
           display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type=text], select { padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
  #url { flex: 1; min-width: 250px; }
  #epgUrl { flex: 1; min-width: 220px; }
  #filter { min-width: 150px; max-width: 220px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #2d7dd2; color: #fff; cursor: pointer; }
  button.secondary { background: #444; }
  button.export { background: #2e9e5b; }
  #status, #count { font-size: 14px; color: #aaa; }
  #status { width: 100%; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 16px; }
  .card { background: #1d1d1d; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
          border: 2px solid transparent; }
  .card.selected { border-color: #2e9e5b; }
  .card.playing { border-color: #2d7dd2; }
  .head { display: flex; align-items: center; gap: 10px; padding: 10px; }
  .logo { width: 48px; height: 48px; object-fit: contain; background: #000; border-radius: 6px; flex-shrink: 0; }
  .logo-empty { width: 48px; height: 48px; background: #000; border-radius: 6px; flex-shrink: 0;
                display: flex; align-items: center; justify-content: center; font-size: 20px; color: #555; }
  .info { min-width: 0; flex: 1; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .group { font-size: 12px; color: #999; }
  .epg { font-size: 12px; color: #bbb; margin-top: 4px; }
  .epg div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .epg .next { color: #888; }
  .sel { width: 20px; height: 20px; cursor: pointer; flex-shrink: 0; }
  .preview { position: relative; aspect-ratio: 16 / 9; background: #000; cursor: pointer; }
  .preview canvas { width: 100%; height: 100%; display: block; }
  .preview video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
  .badge { position: absolute; left: 6px; bottom: 6px; font-size: 11px; background: rgba(0,0,0,.7);
           padding: 2px 6px; border-radius: 4px; pointer-events: none; }
</style>
</head>
<body>

<header>
  <input type="text" id="url" value="https://xarxa-1.github.io/Xarxa-1/cat325.m3u" placeholder="Enganxa aquí la URL de la llista M3U">
  <button id="loadBtn">Carregar</button>
  <input type="text" id="epgUrl" placeholder="URL de l'EPG (XMLTV), opcional">
  <button id="loadEpgBtn" class="secondary">Carregar EPG</button>
  <input type="text" id="filter" placeholder="Filtra per nom...">
  <select id="statusFilter">
    <option value="all">Tots els estats</option>
    <option value="ok">Amb senyal</option>
    <option value="nosignal">Sense senyal</option>
    <option value="pending">Pendents</option>
  </select>
  <button id="selVisBtn" class="secondary">Seleccionar visibles</button>
  <button id="clearBtn" class="secondary">Desseleccionar tots</button>
  <button id="stopPlayBtn" class="secondary">Atura reproducció</button>
  <button id="exportBtn" class="export">Exporta seleccionats (M3U)</button>
  <span id="count"></span>
  <div id="status">Introdueix una URL i prem Carregar.</div>
</header>

<div id="grid"></div>

<script>
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count');
const urlInput = document.getElementById('url');
const epgUrlInput = document.getElementById('epgUrl');
const filterInput = document.getElementById('filter');
const statusFilter = document.getElementById('statusFilter');

const MAX_PREVIEWS = 4;      // captures en procés a la vegada
const PLAY_TIMEOUT = 15000;  // ms per considerar "Sense senyal"
let channels = [];
let detectedEpgUrl = '';     // url-tvg trobada a la capçalera de la llista
const previews = new Map();  // card -> estat de la captura en segon pla
const queue = [];            // cards pendents de captura (totes, sigui visible o no)
let active = null;           // canal que es reprodueix ara: { card, video, hls, timer }

// EPG: canal (id XMLTV) -> llista de programes ordenats per hora d'inici
let epgData = new Map();
// EPG: nom normalitzat -> id XMLTV del canal
let epgNames = new Map();

// Estats possibles: 'pending' (pendent), 'ok' (amb senyal), 'nosignal' (sense senyal)

// ---------- Utilitats ----------
function normKey(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

// ---------- Parsejar M3U ----------
function parseM3U(text) {
  const lines = text.split(/\r?\n/);
  const result = [];
  let current = null;
  detectedEpgUrl = '';

  for (let line of lines) {
    line = line.trim();
    if (!line) continue;

    if (line.startsWith('#EXTM3U')) {
      const m = line.match(/(?:url-tvg|x-tvg-url)="([^"]*)"/i);
      if (m) detectedEpgUrl = m[1].split(',')[0].trim();
    } else if (line.startsWith('#EXTINF')) {
      const name = line.substring(line.lastIndexOf(',') + 1).trim();
      const logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
      const group = (line.match(/group-title="([^"]*)"/) || [])[1] || '';
      const tvgId = (line.match(/tvg-id="([^"]*)"/) || [])[1] || '';
      const tvgName = (line.match(/tvg-name="([^"]*)"/) || [])[1] || '';
      current = { extinf: line, name: name || 'Sense nom', logo, group, tvgId, tvgName, url: '', selected: false };
    } else if (!line.startsWith('#')) {
      if (current) {
        current.url = line;
        result.push(current);
        current = null;
      } else {
        result.push({ extinf: `#EXTINF:-1,${line}`, name: line, logo: '', group: '', tvgId: '', tvgName: '', url: line, selected: false });
      }
    }
  }
  return result.filter(c => c.url);
}

// ---------- Carregar llista ----------
async function loadPlaylist() {
  const url = urlInput.value.trim();
  if (!url) return;
  statusEl.textContent = 'Carregant llista...';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    channels = parseM3U(text);
    statusEl.textContent = `${channels.length} canals carregats`;
    buildCards();

    // Si la llista indica una EPG, la fem servir automàticament
    if (detectedEpgUrl) epgUrlInput.value = detectedEpgUrl;
    if (epgUrlInput.value.trim()) loadEpg(epgUrlInput.value.trim());
  } catch (e) {
    statusEl.textContent = 'Error en carregar la llista: ' + e.message +
      '. Si és un error de CORS, prova amb un proxy.';
  }
}

// ---------- Carregar i processar l'EPG (XMLTV) ----------
function parseXmltvDate(s) {
  if (!s) return null;
  const m = s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})?(\d{2})?(\d{2})?\s*([+-]\d{4})?/);
  if (!m) return null;
  const [, y, mo, d, h = '00', mi = '00', se = '00', tz] = m;
  const off = tz ? `${tz.slice(0, 3)}:${tz.slice(3)}` : 'Z';
  const date = new Date(`${y}-${mo}-${d}T${h}:${mi}:${se}${off}`);
  return isNaN(date) ? null : date;
}

async function loadEpg(url) {
  if (!url) return;
  statusEl.textContent = 'Carregant EPG...';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let buf = await res.arrayBuffer();

    // Suport per a fitxers comprimits .gz
    const bytes = new Uint8Array(buf);
    const isGzip = bytes[0] === 0x1f && bytes[1] === 0x8b;
    if (isGzip || /\.gz($|\?)/i.test(url)) {
      if (!('DecompressionStream' in window)) throw new Error('el navegador no pot descomprimir .gz');
      const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
      buf = await new Response(stream).arrayBuffer();
    }

    const text = new TextDecoder('utf-8').decode(buf);
    const count = parseXmltv(text);
    statusEl.textContent = `EPG carregada: ${count} programes trobats.`;
    updateAllEpg();
  } catch (e) {
    statusEl.textContent = 'Error en carregar l\'EPG: ' + e.message +
      '. Pot ser per CORS o perquè la URL no és XMLTV.';
  }
}

function parseXmltv(text) {
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('XML no vàlid');

  // Noms dels canals a l'EPG
  epgNames = new Map();
  doc.querySelectorAll('channel').forEach(c => {
    const id = c.getAttribute('id');
    c.querySelectorAll('display-name').forEach(d => {
      const k = normKey(d.textContent);
      if (k && !epgNames.has(k)) epgNames.set(k, id);
    });
  });

  // Programes: només una finestra de temps per no gastar massa memòria
  const now = Date.now();
  const from = now - 2 * 3600 * 1000;
  const to = now + 36 * 3600 * 1000;
  epgData = new Map();
  let total = 0;

  doc.querySelectorAll('programme').forEach(p => {
    const chId = p.getAttribute('channel');
    const start = parseXmltvDate(p.getAttribute('start'));
    const stop = parseXmltvDate(p.getAttribute('stop'));
    if (!chId || !start || !stop) return;
    if (stop.getTime() < from || start.getTime() > to) return;

    const title = p.querySelector('title')?.textContent?.trim() || 'Sense títol';
    if (!epgData.has(chId)) epgData.set(chId, []);
    epgData.get(chId).push({ start, stop, title });
    total++;
  });

  epgData.forEach(list => list.sort((a, b) => a.start - b.start));
  return total;
}

// Troba l'id XMLTV d'un canal: primer per tvg-id, després per tvg-name o nom
function findEpgId(ch) {
  if (ch._epgId !== undefined) return ch._epgId;
  let id = null;
  if (ch.tvgId && epgData.has(ch.tvgId)) id = ch.tvgId;
  if (!id && ch.tvgName && epgNames.has(normKey(ch.tvgName))) id = epgNames.get(normKey(ch.tvgName));
  if (!id && epgNames.has(normKey(ch.name))) id = epgNames.get(normKey(ch.name));
  if (!id && ch.tvgId && epgNames.has(normKey(ch.tvgId))) id = epgNames.get(normKey(ch.tvgId));
  ch._epgId = id;
  return id;
}

// Programa actual i següent
function getNowNext(ch) {
  const id = findEpgId(ch);
  if (!id) return null;
  const list = epgData.get(id);
  if (!list || !list.length) return null;

  const now = Date.now();
  const cur = list.find(p => p.start.getTime() <= now && p.stop.getTime() > now) || null;
  const nextFrom = cur ? cur.stop.getTime() : now;
  const next = list.find(p => p.start.getTime() >= nextFrom && p !== cur) || null;
  return { cur, next };
}

function hhmm(d) {
  return d.toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' });
}

function updateEpgCard(card) {
  const ch = card._channel;
  const nowEl = card._epgNow;
  const nextEl = card._epgNext;
  if (!nowEl) return;

  if (!epgData.size) {
    nowEl.textContent = '';
    nextEl.textContent = '';
    return;
  }

  const info = getNowNext(ch);
  if (!info) {
    nowEl.textContent = 'Sense EPG';
    nextEl.textContent = '';
    return;
  }

  nowEl.textContent = info.cur
    ? `Ara: ${info.cur.title} (${hhmm(info.cur.start)}–${hhmm(info.cur.stop)})`
    : 'Ara: sense informació';
  nextEl.textContent = info.next
    ? `Després: ${info.next.title} (${hhmm(info.next.start)})`
    : '';
}

function updateAllEpg() {
  grid.querySelectorAll('.card').forEach(updateEpgCard);
}

// Refresca l'EPG cada 30 segons perquè el programa actual canviï sol
setInterval(updateAllEpg, 30000);

// ---------- Crear totes les targetes i encuar totes les captures ----------
function buildCards() {
  stopAll();
  grid.innerHTML = '';

  const fragment = document.createDocumentFragment();

  channels.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'card' + (ch.selected ? ' selected' : '');
    card.innerHTML = `
      <div class="head">
        <div class="logo-wrap"></div>
        <div class="info">
          <div class="name"></div>
          <div class="group"></div>
          <div class="epg"><div class="now"></div><div class="next"></div></div>
        </div>
        <input type="checkbox" class="sel" title="Seleccionar canal">
      </div>
      <div class="preview">
        <canvas width="320" height="180"></canvas>
        <span class="badge">En cua...</span>
      </div>`;

    // Logo: si no hi ha logo o falla, es mostra un marcador amb la inicial
    const logoWrap = card.querySelector('.logo-wrap');
    if (ch.logo) {
      const img = document.createElement('img');
      img.className = 'logo';
      img.alt = '';
      img.loading = 'eager';
      img.decoding = 'async';
      img.src = ch.logo;
      img.onerror = () => { logoWrap.replaceChildren(makeLogoPlaceholder(ch.name)); };
      logoWrap.appendChild(img);
    } else {
      logoWrap.appendChild(makeLogoPlaceholder(ch.name));
    }

    card.querySelector('.name').textContent = ch.name;
    card.querySelector('.group').textContent = ch.group;

    const cb = card.querySelector('.sel');
    cb.checked = ch.selected;
    cb.addEventListener('change', () => {
      ch.selected = cb.checked;
      card.classList.toggle('selected', cb.checked);
      updateCount();
    });

    // Clic sobre la vista prèvia: reprodueix (o atura si ja sona)
    card.querySelector('.preview').addEventListener('click', e => {
      if (e.target.tagName === 'VIDEO' && active && active.card === card) return; // deixa funcionar els controls
      playChannel(card);
    });

    card._channel = ch;
    card._cb = cb;
    card._status = 'pending';
    card._epgNow = card.querySelector('.epg .now');
    card._epgNext = card.querySelector('.epg .next');
    fragment.appendChild(card);
    queue.push(card);
  });

  grid.appendChild(fragment);
  applyFilter();
  updateAllEpg();
  fillSlots();
}

function makeLogoPlaceholder(name) {
  const d = document.createElement('div');
  d.className = 'logo-empty';
  d.textContent = (name || '?').charAt(0).toUpperCase();
  return d;
}

// ---------- Estat del senyal i filtres ----------
function setSignalStatus(card, status) {
  card._status = status;
  applyFilter();
}

// Mostra les targetes que compleixen el text i l'estat seleccionats.
// El canal que es reprodueix sempre es manté visible.
function applyFilter() {
  const f = filterInput.value.toLowerCase();
  const st = statusFilter.value;
  grid.querySelectorAll('.card').forEach(card => {
    const nameMatch = card._channel.name.toLowerCase().includes(f);
    const statusMatch = st === 'all' || card._status === st;
    const isActive = active && active.card === card;
    card.style.display = (nameMatch && statusMatch) || isActive ? '' : 'none';
  });
  updateCount();
}

function updateCount() {
  const selected = channels.filter(c => c.selected).length;
  const visible = [...grid.querySelectorAll('.card')].filter(c => c.style.display !== 'none').length;
  countEl.textContent = `${selected} seleccionats de ${channels.length} · ${visible} visibles`;
}

// ---------- Adjuntar la font de vídeo (HLS o directa) ----------
// Retorna la instància de hls.js si n'hi ha
function attachSource(video, url, onFail) {
  let hls = null;
  if (/m3u8/i.test(url)) {
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ maxBufferLength: 5 });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) onFail(); });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play().catch(() => {});
    } else {
      onFail();
    }
  } else {
    video.src = url;
    video.play().catch(() => {});
  }
  return hls;
}

// ---------- Cua de captures: màxim MAX_PREVIEWS a la vegada ----------
function fillSlots() {
  while (previews.size < MAX_PREVIEWS && queue.length) {
    const card = queue.shift();
    if (card._done || previews.has(card) || card === (active && active.card)) continue;
    startPreview(card);
  }
}

function startPreview(card) {
  const ch = card._channel;
  const video = document.createElement('video');
  video.muted = true;
  video.playsInline = true;
  video.autoplay = true;

  const canvas = card.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const badge = card.querySelector('.badge');

  const p = { video, hls: null, failTimer: null };
  previews.set(card, p);
  badge.textContent = 'Carregant...';

  // Dibuixa un sol fotograma i atura el stream
  const grab = () => {
    if (card._done || !video.videoWidth || video.readyState < 2) return;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    card._done = true;
    badge.textContent = 'Captura';
    stopPreview(card);
    setSignalStatus(card, 'ok');
    fillSlots();
  };

  video.addEventListener('playing', grab);
  video.addEventListener('loadeddata', grab);
  video.addEventListener('error', () => fail(card));

  p.failTimer = setTimeout(() => fail(card), PLAY_TIMEOUT);
  p.hls = attachSource(video, ch.url, () => fail(card));
}

function stopPreview(card) {
  const p = previews.get(card);
  if (!p) return;
  clearTimeout(p.failTimer);
  if (p.hls) p.hls.destroy();
  p.video.pause();
  p.video.removeAttribute('src');
  p.video.load();
  previews.delete(card);
}

function fail(card) {
  if (!previews.has(card)) return;
  stopPreview(card);
  card._done = true; // marca definitiva: no es reintenta
  card.querySelector('.badge').textContent = 'Sense senyal';
  setSignalStatus(card, 'nosignal');
  fillSlots();
}

// ---------- Reproducció en directe: només un canal alhora ----------
function playChannel(card) {
  // Si ja sona aquest, l'aturem (es queda la imatge fixa)
  if (active && active.card === card) {
    stopActive();
    return;
  }

  stopActive();                 // l'anterior es queda com a imatge fixa
  if (previews.has(card)) stopPreview(card); // aturem la captura en segon pla d'aquest canal

  const preview = card.querySelector('.preview');
  const badge = card.querySelector('.badge');
  const video = document.createElement('video');
  video.controls = true;
  video.playsInline = true;
  video.autoplay = true;
  // No està silenciat: el clic de l'usuari permet el so
  preview.insertBefore(video, badge);

  card.classList.add('playing');
  badge.textContent = 'Carregant...';

  const state = { card, video, hls: null, timer: null };
  active = state;
  applyFilter(); // assegura que el canal actiu es vegi

  state.timer = setTimeout(() => playFail(card), PLAY_TIMEOUT);
  video.addEventListener('playing', () => {
    clearTimeout(state.timer);
    badge.textContent = 'Reproduint';
    if (card._status !== 'ok') setSignalStatus(card, 'ok');
  });
  video.addEventListener('error', () => playFail(card));

  state.hls = attachSource(video, card._channel.url, () => playFail(card));
}

// Atura el canal que sona, deixa la imatge de l'últim fotograma
function stopActive() {
  if (!active) return;
  const { card, video, hls, timer } = active;
  const canvas = card.querySelector('canvas');
  const badge = card.querySelector('.badge');

  clearTimeout(timer);

  let frameDrawn = false;
  if (video.videoWidth && video.readyState >= 2) {
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    frameDrawn = true;
  }

  if (hls) hls.destroy();
  video.pause();
  video.removeAttribute('src');
  video.load();
  video.remove();

  card.classList.remove('playing');
  active = null;

  if (frameDrawn) {
    card._done = true;
    badge.textContent = 'Captura';
    card._status = 'ok';
  } else if (!card._done) {
    badge.textContent = 'En cua...';
    queue.push(card); // encara no té captura: tornarà a la cua
  }

  applyFilter();
  fillSlots();
}

function playFail(card) {
  if (!active || active.card !== card) return;
  const badge = card.querySelector('.badge');
  clearTimeout(active.timer);
  if (active.hls) active.hls.destroy();
  active.video.remove();
  card.classList.remove('playing');
  card._done = true;
  badge.textContent = 'Sense senyal';
  active = null;
  setSignalStatus(card, 'nosignal');
  fillSlots();
}

function stopAll() {
  stopActive();
  [...previews.keys()].forEach(stopPreview);
  queue.length = 0;
}

// ---------- Selecció i exportació ----------
function selectVisible() {
  grid.querySelectorAll('.card').forEach(card => {
    if (card.style.display === 'none') return;
    card._channel.selected = true;
    card._cb.checked = true;
    card.classList.add('selected');
  });
  updateCount();
}

function clearSelection() {
  channels.forEach(c => { c.selected = false; });
  grid.querySelectorAll('.card').forEach(card => {
    card._cb.checked = false;
    card.classList.remove('selected');
  });
  updateCount();
}

function exportSelected() {
  const sel = channels.filter(c => c.selected);
  if (!sel.length) {
    statusEl.textContent = 'No hi ha cap canal seleccionat.';
    return;
  }
  const lines = ['#EXTM3U'];
  sel.forEach(c => {
    lines.push(c.extinf);
    lines.push(c.url);
  });
  const blob = new Blob([lines.join('\n') + '\n'], { type: 'audio/x-mpegurl' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'canals_seleccionats.m3u';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  statusEl.textContent = `Exportats ${sel.length} canals.`;
}

// ---------- Esdeveniments ----------
document.getElementById('loadBtn').addEventListener('click', loadPlaylist);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadPlaylist(); });
document.getElementById('loadEpgBtn').addEventListener('click', () => loadEpg(epgUrlInput.value.trim()));
epgUrlInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadEpg(epgUrlInput.value.trim()); });
filterInput.addEventListener('input', applyFilter);
statusFilter.addEventListener('change', applyFilter);
document.getElementById('selVisBtn').addEventListener('click', selectVisible);
document.getElementById('clearBtn').addEventListener('click', clearSelection);
document.getElementById('stopPlayBtn').addEventListener('click', stopActive);
document.getElementById('exportBtn').addEventListener('click', exportSelected);

loadPlaylist();
</script>
</body>
</html>
